              private static void breaker(ServerPlayerEntity p, ServerWorld w) {
                  Anomaly a = firstOf(AType.LIGHTS);
                  if (a != null) {
                      resolve(a, true, w);
                  } else {
                      p.sendMessage(Text.literal("Щиток в порядке.").formatted(Formatting.GRAY), true);
