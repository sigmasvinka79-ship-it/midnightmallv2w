          def paint_biped(skin, hair, shirt, pants, face, seed, longsleeve=False, shoes=(40, 34, 30), style=None):
              """64x64, раскладка скина (правые части; левые у зомби-модели зеркалят правые)."""
              im = Img(64, 64)
              fill_noise(im, skin, seed, 0.10, 3, 0, 0, 32, 16)                    # голова
              if hair is not None:
                  fill_noise(im, hair, seed + 1, 0.2, 2, 8, 0, 16, 8)              # макушка
                  fill_noise(im, hair, seed + 2, 0.2, 2, 24, 8, 32, 16)            # затылок
                  fill_noise(im, hair, seed + 3, 0.2, 2, 0, 8, 8, 11)
                  fill_noise(im, hair, seed + 4, 0.2, 2, 16, 8, 24, 11)
                  fill_noise(im, hair, seed + 5, 0.2, 2, 8, 8, 16, 10)             # чёлка
              fill_noise(im, shirt, seed + 6, 0.14, 2, 16, 16, 40, 32)             # торс
              fill_noise(im, shirt, seed + 7, 0.14, 2, 40, 16, 56, 26 if not longsleeve else 32)
              if not longsleeve: fill_noise(im, skin, seed + 8, 0.10, 2, 40, 26, 56, 32)  # руки (кисти)
              fill_noise(im, pants, seed + 9, 0.14, 2, 0, 16, 16, 30)              # ноги
              fill_noise(im, shoes, seed + 10, 0.14, 2, 0, 30, 16, 32)
              if style: style(im, seed)
              # лицо: front = (8..15, 8..15)
              if face == 'normal':
                  for ex in (9, 13):
                      im.rect(ex, 12, 2, 1, (240, 240, 240)); im.set(ex + (1 if ex == 9 else 0), 12, (30, 30, 40))
                  im.rect(11, 14, 2, 1, (120, 50, 50))
              elif face == 'blank':
                  for y in range(8, 16):
                      for x in range(8, 16): im.set(x, y, noisy(shade(skin, 0.98), x, y, seed + 11, 0.04, 3))
              elif face == 'void':
                  im.rect(9, 12, 2, 2, (4, 4, 6)); im.rect(13, 12, 2, 2, (4, 4, 6))
                  im.rect(10, 14, 4, 1, (10, 6, 6)); im.set(10, 15, (10, 6, 6)); im.set(12, 15, (10, 6, 6)); im.set(14, 15, (10, 6, 6))
              return im

          def stripe_bandage(im, seed):
              for y in range(0, 64, 3):
                  for x in range(0, 64):
                      old = im.get(x, y)
                      if old[3] > 0: im.set(x, y, mix(old, (225, 222, 205), 0.9))

          def wounds(im, seed):
              rnd = random.Random(seed)
              for _ in range(14):
                  x, y = rnd.randint(0, 63), rnd.randint(0, 31)
                  if im.get(x, y)[3] > 0: im.rect(x, y, rnd.randint(1, 3), 1, (96, 12, 12, 255))

          def patches(im, seed):
              rnd = random.Random(seed)
              for _ in range(9):
                  x, y, w, h = rnd.randint(0, 56), rnd.randint(0, 28), rnd.randint(3, 6), rnd.randint(2, 4)
                  c = rnd.choice(((120, 140, 118), (196, 170, 150), (90, 70, 66)))
                  for yy in range(y, y + h):
                      for xx in range(x, x + w):
                          if im.get(xx, yy)[3] > 0: im.set(xx, yy, noisy(c, xx, yy, seed, 0.1, 2))
                  for xx in range(x, x + w, 2):
                      if im.get(xx, y)[3] > 0: im.set(xx, y, (20, 20, 20))

          def paint_thin(base, accent, seed, extra=None):
              """64x32 скелет/тощий: голова (0,0), торс (16,16), руки (40,16), ноги (0,16)."""
              im = Img(64, 32)
              fill_noise(im, base, seed, 0.14, 3, 0, 0, 64, 32)
              fill_noise(im, accent, seed + 1, 0.2, 2, 16, 16, 40, 32)
              for y in range(16, 32):
                  for x in range(16, 40):
                      if (y - 20) % 3 == 0 and 20 <= y < 30: im.set(x, y, shade(base, 0.45))
              if extra: extra(im, seed)
              im.rect(9, 12, 2, 2, (4, 4, 6)); im.rect(13, 12, 2, 2, (4, 4, 6))
              im.rect(9, 15, 6, 1, (12, 8, 8))
              for x in (9, 11, 13): im.set(x, 14, (12, 8, 8))
              return im

          def paint_tall(base, suit, seed, vein=None):
              """64x32 Enderman-раскладка: голова (0,0), торс (32,16), конечности (56,0)."""
              im = Img(64, 32)
              fill_noise(im, base, seed, 0.1, 3, 0, 0, 32, 16)
              fill_noise(im, suit, seed + 1, 0.12, 3, 32, 16, 56, 32)
              fill_noise(im, suit, seed + 2, 0.12, 3, 56, 0, 64, 32)
              if vein:
                  rnd = random.Random(seed + 3)
                  for _ in range(26):
                      x, y = rnd.randint(0, 63), rnd.randint(0, 31)
                      if im.get(x, y)[3] > 0: im.set(x, y, vein)
              im.rect(9, 12, 2, 2, (2, 2, 4)); im.rect(13, 12, 2, 2, (2, 2, 4))
              im.rect(9, 15, 6, 1, (6, 4, 4))
              return im

          def paint_crawler(base, vein, seed):
              """64x32 паук-раскладка."""
              im = Img(64, 32)
              fill_noise(im, base, seed, 0.18, 2, 0, 0, 64, 32)
              rnd = random.Random(seed + 1)
              for _ in range(60):
                  x, y = rnd.randint(0, 63), rnd.randint(0, 31)
                  im.set(x, y, vein)
              for (x, y) in ((41, 14), (42, 14), (45, 14), (46, 14), (43, 16), (44, 16), (41, 17), (46, 17)):
                  im.set(x, y, (6, 2, 2))
              return im

          def eyes_img(w, h, pts, color):
              im = Img(w, h)
              for (x, y) in pts: im.set(x, y, color + (255,))
              return im

          EYES_FACE = [(9, 12), (10, 12), (9, 13), (10, 13), (13, 12), (14, 12), (13, 13), (14, 13)]
          EYES_SPIDER = [(41, 14), (42, 14), (45, 14), (46, 14), (43, 16), (44, 16), (41, 17), (46, 17)]

          SKINS = []  # (id, name, painter)
          def sk(i, name, im): SKINS.append((i, name)); im.save(os.path.join(TE, name + '.png')); sheet_ent.append((name, im))
          sheet_ent = []

          # покупатели 0..7
          cust = [
              (SKIN[0], HAIR[0], (60, 90, 150), (50, 56, 80), False), (SKIN[1], HAIR[1], (170, 50, 60), (40, 40, 44), True),
              (SKIN[2], HAIR[2], (60, 120, 80), (90, 80, 60), False), (SKIN[3], HAIR[3], (200, 180, 70), (60, 70, 100), False),
              (SKIN[4], HAIR[4], (120, 120, 126), (36, 36, 40), True), (SKIN[0], None, (150, 90, 40), (70, 60, 50), False),
              (SKIN[1], HAIR[5], (230, 230, 226), (60, 90, 130), False), (SKIN[2], HAIR[0], (110, 60, 140), (40, 44, 50), True),
          ]
          for i, (s, h, sh, p, ls) in enumerate(cust):
              sk(i, 'cust%d' % i, paint_biped(s, h, sh, p, 'normal', 100 + i * 13, ls))
          # безликие 8..10: те же силуэты, но пустое лицо и слишком бледная кожа
          for k, (s, h, sh, p, ls) in enumerate((cust[0], cust[3], cust[6])):
              sk(8 + k, 'faceless%d' % k, paint_biped((226, 220, 214), h, sh, p, 'blank', 200 + k * 17, ls))
          # бипед-монстры 20..23
          sk(20, 'bmon_pale', paint_biped((196, 202, 198), None, (22, 22, 26), (18, 18, 22), 'void', 300))
          sk(21, 'bmon_rot', paint_biped((104, 124, 84), (30, 36, 24), (52, 44, 34), (40, 34, 28), 'void', 310, True, style=wounds))
          sk(22, 'bmon_wrapped', paint_biped((190, 186, 170), None, (190, 186, 170), (184, 180, 164), 'void', 320, True, style=stripe_bandage))
          sk(23, 'bmon_stitched', paint_biped((172, 142, 126), (24, 20, 20), (60, 56, 70), (46, 46, 54), 'void', 330, True, style=patches))
          # худые 30..31
          sk(30, 'smon_starved', paint_thin((168, 162, 140), (122, 116, 98), 400))
          sk(31, 'smon_hanged', paint_thin((126, 116, 104), (54, 46, 40), 410, wounds))
          # высокие 40..42
          sk(40, 'tmon_watcher', paint_tall((206, 208, 204), (24, 24, 28), 500, (120, 120, 126, 255)))
          sk(41, 'tmon_shadow', paint_tall((8, 8, 10), (6, 6, 8), 510, (20, 20, 24, 255)))
          sk(42, 'tmon_crimson', paint_tall((150, 30, 28), (16, 6, 8), 520, (90, 8, 8, 255)))
          # ползуны 50..51
          sk(50, 'cmon_black', paint_crawler((26, 20, 30), (120, 10, 14, 255), 600))
          sk(51, 'cmon_pale', paint_crawler((178, 170, 158), (60, 50, 44, 255), 610))

          eyes_img(64, 64, EYES_FACE, (225, 240, 255)).save(os.path.join(TE, 'eyes_bmon.png'))
          eyes_img(64, 32, EYES_FACE, (255, 60, 40)).save(os.path.join(TE, 'eyes_smon.png'))
          eyes_img(64, 32, EYES_FACE, (230, 235, 255)).save(os.path.join(TE, 'eyes_tmon.png'))
          eyes_img(64, 32, EYES_SPIDER, (255, 40, 30)).save(os.path.join(TE, 'eyes_cmon.png'))

          skin_lines = '\n'.join('        TEX[%d] = Identifier.of("midnightmall", "textures/entity/%s.png");' % (i, n) for i, n in SKINS)
          open(os.path.join(JAVA, 'MallSkins.java'), 'w', encoding='utf-8').write('''package com.midnightmall;

          import net.minecraft.util.Identifier;

          /** Автогенерируется gen.py: номер варианта -> текстура. */
          public final class MallSkins {
              private MallSkins() {}

              public static final Identifier[] TEX = new Identifier[64];

              static {
          ''' + skin_lines + '''
              }

              public static Identifier tex(int v) {
                  if (v >= 0 && v < TEX.length && TEX[v] != null) return TEX[v];
                  return TEX[0];
              }

              public static Identifier eyes(String family) {
                  return Identifier.of("midnightmall", "textures/entity/eyes_" + family + ".png");
              }
          }
          ''')

          # --- контактный лист для самопроверки
          if len(sys.argv) > 2:
              S = 4
              cols = 9
              cell = 16 * S + 4
              rows = (len(sheet) + cols - 1) // cols
              big = Img(cols * cell, rows * cell, (30, 30, 34, 255))
              for n, (bid, im) in enumerate(sheet):
                  ox, oy = (n % cols) * cell + 2, (n // cols) * cell + 2
                  for y in range(16):
                      for x in range(16):
                          c = im.get(x, y)
                          if c[3] < 255: c = mix((60, 60, 70), c[:3], c[3] / 255.0) + (255,) if c[3] else (60, 60, 70, 255)
                          big.rect(ox + x * S, oy + y * S, S, S, c)
              big.save(sys.argv[2] + '_blocks.png')
              S2 = 3
              cols = 4
              cw, chh = 64 * S2 + 6, 64 * S2 + 6
              rows = (len(sheet_ent) + cols - 1) // cols
              big = Img(cols * cw, rows * chh, (60, 80, 60, 255))
              for n, (nm, im) in enumerate(sheet_ent):
                  ox, oy = (n % cols) * cw + 3, (n // cols) * chh + 3
                  for y in range(im.h):
                      for x in range(im.w):
                          c = im.get(x, y)
                          big.rect(ox + x * S2, oy + y * S2, S2, S2, c if c[3] else (45, 55, 45, 255))
              big.save(sys.argv[2] + '_ents.png')
          print('assets generated:', len(BLOCKS), 'blocks,', len(SKINS), 'skins')
          MALL_EOF_7Q

      - name: Generate textures, models and block registry
        run: |
          set -e
          cd _mall
          python3 gen.py .
          ls src/main/resources/assets/midnightmall/textures/block | wc -l
          ls src/main/resources/assets/midnightmall/textures/entity | wc -l

      - name: Resolve Fabric versions
        run: |
          set -e
          cd _mall
          MC=1.21.1
          LOADER=$(curl -fsS -A "midnightmall-build" https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable==true)][0].version' || true)
          YARN=$(curl -fsS -A "midnightmall-build" "https://meta.fabricmc.net/v2/versions/yarn/$MC" | jq -r '.[0].version' || true)
          FAPI=$(curl -fsS -A "midnightmall-build" 'https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%221.21.1%22%5D&loaders=%5B%22fabric%22%5D' | jq -r '.[0].version_number' || true)
          if ! echo "$LOADER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then LOADER=0.16.9; fi
          if ! echo "$YARN" | grep -Eq '^1\.21\.1\+build\.[0-9]+$'; then YARN=1.21.1+build.3; fi
          if ! echo "$FAPI" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\+1\.21\.1$'; then FAPI=0.105.0+1.21.1; fi
          echo "loader=$LOADER yarn=$YARN fabric-api=$FAPI"
          {
            echo "org.gradle.jvmargs=-Xmx2G"
            echo "org.gradle.parallel=true"
            echo "minecraft_version=$MC"
            echo "yarn_mappings=$YARN"
            echo "loader_version=$LOADER"
            echo "fabric_version=$FAPI"
            echo "mod_version=2.0.0"
            echo "maven_group=com.midnightmall"
            echo "archives_base_name=midnightmall"
          } > gradle.properties
          cat gradle.properties

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        working-directory: _mall
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: MidnightMall
          path: _mall/build/libs/midnightmall-*.jar
          if-no-files-found: error
