              private static void phone(ServerPlayerEntity p, ServerWorld w) {
                  Anomaly a = firstOf(AType.PHONE);
                  if (a != null) {
                      p.sendMessage(Text.literal("☎ «" + CALLS[RNG.nextInt(CALLS.length)] + "»").formatted(Formatting.DARK_PURPLE), false);
                      resolve(a, true, w);
                  } else {
                      p.sendMessage(Text.literal("Телефон молчит.").formatted(Formatting.GRAY), true);
