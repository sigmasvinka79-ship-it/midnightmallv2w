name: Build Midnight Mall v2

# Один файл на весь мод (v2): положи его в .github/workflows/midnight-mall-v2.yml
# Сборка стартует сама после коммита; можно и вручную: Actions -> Build Midnight Mall v2 -> Run workflow.
# Текстуры, модели и список блоков генерируются прямо при сборке.
# Готовый jar появится в Artifacts (MidnightMall).

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Write project (gradle + resources)
        run: |
          set -e
          mkdir -p _mall && cd _mall
          mkdir -p src/main/java/com/midnightmall
          mkdir -p src/main/resources/data/midnightmall/dimension
          mkdir -p src/main/resources/data/midnightmall/dimension_type
          cat > build.gradle <<'MALL_EOF_7Q'
          plugins {
              id 'fabric-loom' version '1.8-SNAPSHOT'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
              it.options.encoding = 'UTF-8'
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          MALL_EOF_7Q
          cat > settings.gradle <<'MALL_EOF_7Q'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'midnightmall'
          MALL_EOF_7Q
          cat > src/main/resources/fabric.mod.json <<'MALL_EOF_7Q'
          {
            "schemaVersion": 1,
            "id": "midnightmall",
            "version": "${version}",
            "name": "Midnight Mall",
            "description": "Каждую ночь вы засыпаете и просыпаетесь на смене в огромном торговом центре. Обслуживайте покупателей, ставьте товар на полки, принимайте посылки и не пропускайте аномалии.",
            "authors": ["Claude"],
            "license": "MIT",
            "environment": "*",
            "entrypoints": {
              "main": ["com.midnightmall.MidnightMall"],
              "client": ["com.midnightmall.MallClient"]
            },
            "depends": {
              "fabricloader": ">=0.15.0",
              "minecraft": ">=1.21 <=1.21.1",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          MALL_EOF_7Q
          cat > src/main/resources/data/midnightmall/dimension/mall.json <<'MALL_EOF_7Q'
          {
            "type": "midnightmall:mall",
            "generator": {
              "type": "minecraft:flat",
              "settings": {
                "biome": "minecraft:the_void",
                "features": false,
                "lakes": false,
                "layers": [
                  { "block": "minecraft:air", "height": 1 }
                ],
                "structure_overrides": []
              }
            }
          }
          MALL_EOF_7Q
          cat > src/main/resources/data/midnightmall/dimension_type/mall.json <<'MALL_EOF_7Q'
          {
            "ultrawarm": false,
            "natural": false,
            "coordinate_scale": 1.0,
            "has_skylight": false,
            "has_ceiling": true,
            "ambient_light": 0.0,
            "fixed_time": 18000,
            "monster_spawn_light_level": 0,
            "monster_spawn_block_light_limit": 0,
            "piglin_safe": false,
            "bed_works": false,
            "respawn_anchor_works": false,
            "has_raids": false,
            "logical_height": 128,
            "min_y": 0,
            "height": 128,
            "infiniburn": "#minecraft:infiniburn_overworld",
            "effects": "minecraft:overworld"
          }
          MALL_EOF_7Q

      - name: Write project (Java sources)
        run: |
          set -e
          cd _mall
          cat > src/main/java/com/midnightmall/Fx.java <<'MALL_EOF_7Q'
          package com.midnightmall;

          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.registry.entry.RegistryEntry;
          import net.minecraft.server.world.ServerWorld;
          import net.minecraft.sound.SoundCategory;
          import net.minecraft.sound.SoundEvent;

          /** Мелкие помощники для звуков (принимают и SoundEvent, и RegistryEntry). */
          public final class Fx {
              private Fx() {}

              public static void sound(ServerWorld w, double x, double y, double z, Object sound, float vol, float pitch) {
                  SoundEvent ev;
                  if (sound instanceof SoundEvent se) {
                      ev = se;
                  } else {
                      ev = (SoundEvent) ((RegistryEntry<?>) sound).value();
                  }
                  w.playSound((PlayerEntity) null, x, y, z, ev, SoundCategory.AMBIENT, vol, pitch);
              }
          }
          MALL_EOF_7Q
          cat > src/main/java/com/midnightmall/MallBuilder.java <<'MALL_EOF_7Q'
          package com.midnightmall;

          import net.minecraft.block.Block;
          import net.minecraft.block.BlockState;
          import net.minecraft.block.Blocks;
          import net.minecraft.block.StairsBlock;
          import net.minecraft.server.world.ServerWorld;
          import net.minecraft.util.math.BlockPos;
          import net.minecraft.util.math.Direction;
          import net.minecraft.util.math.Vec3d;
          import net.minecraft.world.World;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;
          import java.util.Random;

          /** Геометрия и генерация торгового центра (кодом) + «порча» центра по ночам. */
          public final class MallBuilder {
              private MallBuilder() {}

              public static final int X1 = 79, Z1 = 59;
              // слои пола/потолка (поверхность ходьбы = +1): подвал 57, этаж 64, второй этаж 72
              public static final int YB = 56, CB = 62, YG = 63, CG = 70, YF = 71, CF = 78;
              private static final int F = Block.NOTIFY_LISTENERS;
              private static final BlockState AIR = Blocks.AIR.getDefaultState();

              public static final Vec3d SPAWN = new Vec3d(39.5, 64, 16.5);
              public static final Vec3d DOOR_A = new Vec3d(76.5, 64, 26.5);
              public static final Vec3d DOOR_B = new Vec3d(76.5, 64, 33.5);
              public static final Vec3d VENT_SPOT = new Vec3d(60.5, 64, 25.5);
              public static final BlockPos REGISTER = new BlockPos(39, 65, 18);
              public static final BlockPos PHONE = new BlockPos(41, 65, 18);
              public static final BlockPos[] BREAKER = {new BlockPos(45, 58, 58), new BlockPos(45, 59, 58)};
              public static final BlockPos[] DOCK = {
                      new BlockPos(68, 57, 5), new BlockPos(70, 57, 5), new BlockPos(72, 57, 5), new BlockPos(74, 57, 5)
              };
              public static final Vec3d[] HANG_SPOTS = {
                      new Vec3d(39.5, 66.3, 29.5), new Vec3d(22.5, 66.3, 30.5), new Vec3d(58.5, 66.3, 29.5)
              };

              public record Shelf(int x1, int x2, int z, int dz) {
                  public Vec3d approach() {
                      return new Vec3d(x1 + (x2 - x1 + 1) / 2.0, 64, z + dz + 0.5);
                  }

                  public boolean contains(BlockPos p) {
                      return p.getZ() == z && p.getX() >= x1 && p.getX() <= x2 && p.getY() >= 64 && p.getY() <= 65;
                  }
              }

              public static final List<Shelf> SHELVES = new ArrayList<>();
              public static final List<BlockPos> LIGHTS = new ArrayList<>();
              public static final List<BlockPos> EMERGENCY = new ArrayList<>();
              public static final List<BlockPos> DECALS = new ArrayList<>();
              public static final List<BlockPos> MANN = new ArrayList<>();

              static {
                  int[][] four = {{31, 34}, {36, 39}, {41, 44}, {46, 49}};
                  int[][] three = {{31, 34}, {36, 39}, {41, 44}};
                  for (int[] r : four) SHELVES.add(new Shelf(r[0], r[1], 2, 1));
                  for (int[] r : three) SHELVES.add(new Shelf(r[0], r[1], 7, 1));
                  for (int[] r : three) SHELVES.add(new Shelf(r[0], r[1], 13, -1));

                  int[] ys = {CB, CG, CF};
                  for (int y : ys) {
                      for (int ix = 0; ix < 10; ix++) {
                          for (int iz = 0; iz < 7; iz++) {
                              BlockPos p = new BlockPos(4 + ix * 8, y, 4 + iz * 8);
                              if ((ix + iz) % 3 == 0) EMERGENCY.add(p);
                              else LIGHTS.add(p);
                          }
                      }
                  }

                  // кандидаты под пятна крови (порядок фиксирован: с каждой ночью их всё больше)
                  Random r = new Random(77);
                  int[][] zones = {
                          {64, 14, 65, 24, 35}, {64, 30, 49, 3, 21}, {57, 14, 64, 24, 38}, {72, 14, 64, 24, 35}, {64, 2, 5, 24, 35}
                  };
                  for (int i = 0; i < 160; i++) {
                      int[] z = zones[i % zones.length];
                      DECALS.add(new BlockPos(z[1] + r.nextInt(z[2] - z[1] + 1), z[0], z[3] + r.nextInt(z[4] - z[3] + 1)));
                  }
                  // места для манекенов (нижний блок; верхний на +1)
                  int[] shopsX = {4, 10, 18, 24, 55, 61, 69, 75};
                  for (int x : shopsX) {
                      MANN.add(new BlockPos(x, 64, 20));
                      MANN.add(new BlockPos(x, 64, 39));
                      MANN.add(new BlockPos(x, 72, 20));
                      MANN.add(new BlockPos(x, 72, 39));
                  }
                  MANN.add(new BlockPos(20, 72, 27));
                  MANN.add(new BlockPos(32, 72, 33));
                  MANN.add(new BlockPos(47, 72, 27));
                  MANN.add(new BlockPos(59, 72, 33));
              }

              public static final Vec3d[][] WATCH_SPOTS = {
                      {new Vec3d(24.5, 57, 33.5), new Vec3d(54.5, 57, 34.5), new Vec3d(34.5, 57, 28.5), new Vec3d(14.5, 57, 45.5)},
                      {new Vec3d(20.5, 64, 28.5), new Vec3d(30.5, 64, 33.5), new Vec3d(48.5, 64, 28.5), new Vec3d(60.5, 64, 33.5)},
                      {new Vec3d(20.5, 72, 29.5), new Vec3d(48.5, 72, 29.5), new Vec3d(60.5, 72, 26.5), new Vec3d(30.5, 72, 33.5)}
              };

              public static int floorOf(double y) {
                  if (y < 62) return 0;
                  if (y < 70) return 1;
                  return 2;
              }

              // ---------- вспомогательные ----------

              private static BlockState st(Block b) {
                  return b.getDefaultState();
              }

              private static int hash(int x, int y, int z) {
                  int h = x * 73856093 ^ y * 19349663 ^ z * 83492791;
                  return (h & 0x7fffffff) % 1000;
              }

              private static void set(World w, int x, int y, int z, BlockState s) {
                  w.setBlockState(new BlockPos(x, y, z), s, F);
              }

              private static void fill(World w, int x1, int y1, int z1, int x2, int y2, int z2, BlockState s) {
                  BlockPos.Mutable m = new BlockPos.Mutable();
                  for (int x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
                      for (int y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
                          for (int z = Math.min(z1, z2); z <= Math.max(z1, z2); z++) {
                              m.set(x, y, z);
                              w.setBlockState(m, s, F);
                          }
                      }
                  }
              }

              /** Заливка с вариациями: основной блок и «испорченный» по хэшу. */
              private static void fillMix(World w, int x1, int y1, int z1, int x2, int y2, int z2, Block a, Block b, int every) {
                  BlockPos.Mutable m = new BlockPos.Mutable();
                  for (int x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
                      for (int y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
                          for (int z = Math.min(z1, z2); z <= Math.max(z1, z2); z++) {
                              m.set(x, y, z);
                              w.setBlockState(m, hash(x, y, z) % every == 0 ? st(b) : st(a), F);
                          }
                      }
                  }
              }

              private static void hollowMix(World w, int x1, int z1, int x2, int z2, int y1, int y2, Block a, Block b, int every) {
                  fillMix(w, x1, y1, z1, x2, y2, z1, a, b, every);
                  fillMix(w, x1, y1, z2, x2, y2, z2, a, b, every);
                  fillMix(w, x1, y1, z1, x1, y2, z2, a, b, every);
                  fillMix(w, x2, y1, z1, x2, y2, z2, a, b, every);
              }

              private static Block tileFor(int x, int z, int night) {
                  int h = hash(x, 5, z) % 100;
                  if (h < night * 1.2) return MallBlocks.TILE_BLOOD;
                  if (h < night * 4 + 3) return MallBlocks.TILE_STAINED;
                  if (h < night * 9 + 8) return MallBlocks.TILE_CRACKED;
                  return (((x >> 1) + (z >> 1)) & 1) == 0 ? MallBlocks.TILE_A : MallBlocks.TILE_B;
              }

              private static boolean isTile(BlockState s) {
                  return s.isOf(MallBlocks.TILE_A) || s.isOf(MallBlocks.TILE_B) || s.isOf(MallBlocks.TILE_CRACKED)
                          || s.isOf(MallBlocks.TILE_STAINED) || s.isOf(MallBlocks.TILE_BLOOD);
              }

              private static void tiles(World w, int y, int night, boolean onlyTiles) {
                  BlockPos.Mutable m = new BlockPos.Mutable();
                  for (int x = 0; x <= X1; x++) {
                      for (int z = 0; z <= Z1; z++) {
                          m.set(x, y, z);
                          BlockState want = st(tileFor(x, z, night));
                          if (onlyTiles) {
                              BlockState cur = w.getBlockState(m);
                              if (isTile(cur) && cur != want) w.setBlockState(m, want, F);
                          } else {
                              w.setBlockState(m, want, F);
                          }
                      }
                  }
              }

              // ---------- свет ----------

              public static void setLights(ServerWorld w, boolean on) {
                  BlockState s = on ? st(MallBlocks.LAMP_ON) : st(MallBlocks.LAMP_OFF);
                  for (BlockPos p : LIGHTS) {
                      w.setBlockState(p, s, F);
                  }
              }

              // ---------- полки ----------

              public static void refreshShelf(ServerWorld w, int idx, int stock) {
                  Shelf s = SHELVES.get(idx);
                  BlockState bs = stock > 0 ? st(MallBlocks.SHELF_FULL) : st(MallBlocks.SHELF_EMPTY);
                  for (int x = s.x1(); x <= s.x2(); x++) {
                      for (int y = 64; y <= 65; y++) {
                          w.setBlockState(new BlockPos(x, y, s.z()), bs, F);
                      }
                  }
              }

              // ---------- порча центра по ночам ----------

              public static void dress(ServerWorld w, int night) {
                  tiles(w, YG, night, true);
                  tiles(w, YF, night, true);
                  for (BlockPos p : DECALS) {
                      if (w.getBlockState(p).isOf(MallBlocks.BLOOD_DECAL)) w.setBlockState(p, AIR, F);
                  }
                  for (BlockPos p : MANN) {
                      if (w.getBlockState(p).isOf(MallBlocks.MANNEQUIN_LOW)) w.setBlockState(p, AIR, F);
                      BlockPos up = p.up();
                      if (w.getBlockState(up).isOf(MallBlocks.MANNEQUIN_HIGH)) w.setBlockState(up, AIR, F);
                  }
                  int nd = Math.min(DECALS.size(), 6 + night * 10);
                  for (int i = 0; i < nd; i++) {
                      BlockPos p = DECALS.get(i);
                      if (w.getBlockState(p).isAir() && !w.getBlockState(p.down()).isAir()) {
                          w.setBlockState(p, st(MallBlocks.BLOOD_DECAL), F);
                      }
                  }
                  List<BlockPos> order = new ArrayList<>(MANN);
                  Collections.shuffle(order, new Random(night * 31L + 5));
                  int nm = Math.min(order.size(), 2 + night * 3);
                  for (int i = 0; i < nm; i++) {
                      BlockPos p = order.get(i);
                      if (w.getBlockState(p).isAir() && w.getBlockState(p.up()).isAir() && !w.getBlockState(p.down()).isAir()) {
                          w.setBlockState(p, st(MallBlocks.MANNEQUIN_LOW), F);
                          w.setBlockState(p.up(), st(MallBlocks.MANNEQUIN_HIGH), F);
                      }
                  }
              }

              // ---------- генерация ----------

              public static void build(ServerWorld w) {
                  // перекрытия
                  fill(w, 0, YB, 0, X1, YB, Z1, st(MallBlocks.FLOOR_BASEMENT));
                  fillMix(w, 0, CB, 0, X1, CB, Z1, MallBlocks.CEIL_TILE, MallBlocks.CEIL_STAINED, 9);
                  tiles(w, YG, 1, false);
                  fillMix(w, 0, CG, 0, X1, CG, Z1, MallBlocks.CEIL_TILE, MallBlocks.CEIL_STAINED, 7);
                  tiles(w, YF, 1, false);
                  fillMix(w, 0, CF, 0, X1, CF, Z1, MallBlocks.CEIL_TILE, MallBlocks.CEIL_STAINED, 5);

                  // внешние стены
                  hollowMix(w, 0, 0, X1, Z1, YB + 1, CB - 1, MallBlocks.WALL_BRICK, MallBlocks.WALL_BRICK, 1000);
                  hollowMix(w, 0, 0, X1, Z1, YG + 1, CG - 1, MallBlocks.WALL_GRIME, MallBlocks.WALL_PAPER_STAINED, 11);
                  hollowMix(w, 0, 0, X1, Z1, YF + 1, CF - 1, MallBlocks.WALL_GRIME, MallBlocks.WALL_PAPER_STAINED, 6);

                  partitions(w, YG, true);
                  partitions(w, YF, false);
                  warehouse(w);
                  store(w);
                  stairs(w);
                  decor(w);

                  // стеклянный вход (за ним темнота)
                  fill(w, 79, 64, 26, 79, 67, 33, Blocks.GLASS.getDefaultState());

                  for (BlockPos p : EMERGENCY) {
                      w.setBlockState(p, st(MallBlocks.LAMP_EMERGENCY), F);
                  }
                  setLights(w, true);
                  dress(w, 1);
              }

              private static void partitions(ServerWorld w, int floorY, boolean shops) {
                  int y1 = floorY + 1;
                  int y2 = floorY + 6;
                  Block wp = MallBlocks.WALL_PAPER;
                  Block ws = MallBlocks.WALL_PAPER_STAINED;

                  int[] divs = {14, 28, 51, 65};
                  for (int x : divs) {
                      fillMix(w, x, y1, 1, x, y2, 22, wp, ws, 8);
                      fillMix(w, x, y1, 37, x, y2, 58, wp, ws, 8);
                  }
                  fillMix(w, 1, y1, 23, X1 - 1, y2, 23, wp, ws, 8);
                  fillMix(w, 1, y1, 36, X1 - 1, y2, 36, wp, ws, 8);

                  int[][] gapsN = {{6, 9}, {19, 22}, {36, 43}, {56, 59}, {70, 73}};
                  int[][] gapsS = {{6, 9}, {19, 22}, {34, 45}, {56, 59}, {70, 73}};
                  for (int[] g : gapsN) fill(w, g[0], y1, 23, g[1], y2, 23, AIR);
                  for (int[] g : gapsS) fill(w, g[0], y1, 36, g[1], y2, 36, AIR);

                  // вентиляционные решётки над дверями
                  int[] vx = {10, 24, 47, 60, 74, 3};
                  for (int x : vx) {
                      set(w, x, y1 + 3, 23, st(MallBlocks.VENT));
                      set(w, x, y1 + 3, 36, st(MallBlocks.VENT));
                  }
                  // таблички выхода над входами магазинов
                  for (int[] g : gapsN) set(w, (g[0] + g[1]) / 2, y2, 23, st(MallBlocks.EXIT_SIGN));
                  for (int[] g : gapsS) set(w, (g[0] + g[1]) / 2, y2, 36, st(MallBlocks.EXIT_SIGN));

                  // колонны галереи
                  int[] cx = {20, 32, 47, 59};
                  int[] cz = {26, 33};
                  for (int x : cx) {
                      for (int z : cz) {
                          fill(w, x, y1, z, x, y2, z, st(MallBlocks.PILLAR));
                      }
                  }
                  // автоматы вдоль стен
                  int[] ax = {16, 62};
                  for (int x : ax) {
                      fill(w, x, y1, 24, x, y1 + 1, 24, st(MallBlocks.VENDING));
                      fill(w, x, y1, 35, x, y1 + 1, 35, st(MallBlocks.VENDING));
                  }

                  if (shops) {
                      int[][] north = {{1, 13}, {15, 27}, {52, 64}, {66, 78}};
                      int[][] south = {{1, 13}, {15, 27}, {52, 64}, {66, 78}};
                      for (int[] r : north) {
                          fill(w, r[0], YG, 1, r[1], YG, 22, st(MallBlocks.FLOOR_STORE));
                          fill(w, r[0] + 1, y1, 1, r[1] - 1, y1 + 1, 1, st(MallBlocks.SHELF_FULL));
                          fill(w, r[0] + 1, y1, 5, r[0] + 3, y1, 5, st(MallBlocks.CRATE));
                      }
                      for (int[] r : south) {
                          fill(w, r[0], YG, 37, r[1], YG, 58, st(MallBlocks.FLOOR_STORE));
                          fill(w, r[0] + 1, y1, 58, r[1] - 1, y1 + 1, 58, st(MallBlocks.SHELF_EMPTY));
                          fill(w, r[1] - 3, y1, 54, r[1] - 1, y1, 54, st(MallBlocks.CRATE));
                      }
                      // фудкорт (юг, центр): столики
                      fill(w, 29, YG, 37, 50, YG, 58, st(MallBlocks.FLOOR_STORE));
                      for (int x = 32; x <= 48; x += 4) {
                          for (int z = 42; z <= 54; z += 4) {
                              set(w, x, 64, z, Blocks.OAK_FENCE.getDefaultState());
                              set(w, x, 65, z, Blocks.OAK_PRESSURE_PLATE.getDefaultState());
                          }
                      }
                  }
              }

              private static void warehouse(ServerWorld w) {
                  int[] rows = {10, 16, 22, 40, 46, 52};
                  int[][] segs = {{16, 22}, {26, 32}, {36, 42}, {46, 52}, {56, 62}};
                  for (int z : rows) {
                      for (int[] s : segs) {
                          fill(w, s[0], 57, z, s[1], 58, z, st(MallBlocks.CRATE));
                          for (int x = s[0]; x <= s[1]; x += 2) {
                              set(w, x, 59, z, st(MallBlocks.CRATE));
                          }
                      }
                  }
                  // трубы под потолком
                  fill(w, 1, 61, 20, 78, 61, 20, st(MallBlocks.PIPE));
                  fill(w, 1, 61, 44, 78, 61, 44, st(MallBlocks.PIPE));
                  // погрузочная зона
                  fill(w, 66, YB, 3, 76, YB, 8, st(MallBlocks.FLOOR_HAZARD));
                  // щиток
                  for (BlockPos p : BREAKER) {
                      w.setBlockState(p, st(MallBlocks.BREAKER), F);
                  }
                  set(w, 44, 59, 58, st(MallBlocks.LAMP_EMERGENCY));
                  set(w, 46, 59, 58, st(MallBlocks.LAMP_EMERGENCY));
              }

              private static void store(ServerWorld w) {
                  fill(w, 29, YG, 1, 50, YG, 22, st(MallBlocks.FLOOR_STORE));
                  // витрина
                  for (int x = 29; x <= 50; x++) {
                      if (x >= 36 && x <= 43) continue;
                      fill(w, x, 64, 23, x, 67, 23, Blocks.GLASS.getDefaultState());
                  }
                  // прилавок (непроходимый: коллизия 1.5 блока), касса, телефон
                  fill(w, 36, 64, 18, 43, 64, 18, st(MallBlocks.COUNTER));
                  w.setBlockState(REGISTER, st(MallBlocks.REGISTER), F);
                  w.setBlockState(PHONE, st(MallBlocks.PHONE), F);
                  for (int i = 0; i < SHELVES.size(); i++) {
                      refreshShelf(w, i, 2);
                  }
              }

              private static void decor(ServerWorld w) {
                  // ящики и мусорные кучи у стен подвала
                  fill(w, 2, 57, 2, 4, 58, 3, st(MallBlocks.CRATE));
                  fill(w, 74, 57, 50, 77, 58, 56, st(MallBlocks.CRATE));
                  // лужи крови в подвале у щитка
                  w.setBlockState(new BlockPos(45, 57, 56), st(MallBlocks.BLOOD_DECAL), F);
                  w.setBlockState(new BlockPos(46, 57, 57), st(MallBlocks.BLOOD_DECAL), F);
              }

              private static void stairs(ServerWorld w) {
                  BlockState brick = st(MallBlocks.WALL_BRICK);
                  BlockState bars = Blocks.IRON_BARS.getDefaultState();
                  BlockState step = Blocks.STONE_BRICK_STAIRS.getDefaultState().with(StairsBlock.FACING, Direction.EAST);

                  // ВНИЗ (в подвал): x 12 -> 6, z 29..31
                  fill(w, 6, CB, 29, 12, YG, 31, AIR);
                  for (int i = 0; i <= 6; i++) {
                      int x = 12 - i;
                      int y = 63 - i;
                      for (int z = 29; z <= 31; z++) {
                          if (y - 1 >= 57) fill(w, x, 57, z, x, y - 1, z, brick);
                          set(w, x, y, z, step);
                      }
                  }
                  for (int x = 6; x <= 12; x++) {
                      for (int y = 64; y <= 65; y++) {
                          w.setBlockState(new BlockPos(x, y, 28), bars, Block.NOTIFY_ALL);
                          w.setBlockState(new BlockPos(x, y, 32), bars, Block.NOTIFY_ALL);
                      }
                  }
                  for (int z = 29; z <= 31; z++) {
                      for (int y = 64; y <= 65; y++) {
                          w.setBlockState(new BlockPos(5, y, z), bars, Block.NOTIFY_ALL);
                      }
                  }

                  // ВВЕРХ (на 2 этаж): x 66 -> 73, z 29..31
                  fill(w, 66, CG, 29, 73, YF, 31, AIR);
                  for (int i = 0; i <= 7; i++) {
                      int x = 66 + i;
                      int y = 64 + i;
                      for (int z = 29; z <= 31; z++) {
                          if (y - 1 >= 64) fill(w, x, 64, z, x, y - 1, z, brick);
                          set(w, x, y, z, step);
                      }
                  }
                  for (int x = 66; x <= 73; x++) {
                      for (int y = 72; y <= 73; y++) {
                          w.setBlockState(new BlockPos(x, y, 28), bars, Block.NOTIFY_ALL);
                          w.setBlockState(new BlockPos(x, y, 32), bars, Block.NOTIFY_ALL);
                      }
                  }
                  for (int z = 29; z <= 31; z++) {
                      for (int y = 72; y <= 73; y++) {
                          w.setBlockState(new BlockPos(65, y, z), bars, Block.NOTIFY_ALL);
                      }
                  }
              }
          }
