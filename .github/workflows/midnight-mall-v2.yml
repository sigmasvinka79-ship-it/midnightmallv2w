                          .then(CommandManager.literal("rebuild").requires(s -> s.hasPermissionLevel(2)).executes(c -> {
                              if (MallManager.active) {
                                  c.getSource().sendFeedback(() -> Text.literal("Сначала завершите смену (/mall end)."), false);
                                  return 0;
                              }
