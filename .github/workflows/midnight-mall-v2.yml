                              return 1;
                          }))
                          .then(CommandManager.literal("status").executes(c -> {
                              MallManager.status(c.getSource().getPlayerOrThrow());
                              return 1;
                          }))
                          .then(CommandManager.literal("anomaly").requires(s -> s.hasPermissionLevel(2))
                                  .then(CommandManager.argument("type", StringArgumentType.word())
                                          .suggests((ctx, b) -> CommandSource.suggestMatching(Arrays.asList(
                                                  "lights", "phone", "parcel", "faceless", "mimic", "watcher", "crawler", "hanged", "chaser"), b))
                                          .executes(c -> {
                                              boolean ok = MallManager.forceAnomaly(StringArgumentType.getString(c, "type"));
                                              c.getSource().sendFeedback(() -> Text.literal(ok
                                                      ? "Аномалия запущена."
                                                      : "Не вышло (смена не идёт, неверный тип или она уже активна)."), false);
                                              return ok ? 1 : 0;
                                          })))
                          .then(CommandManager.literal("night").requires(s -> s.hasPermissionLevel(2))
                                  .then(CommandManager.argument("n", IntegerArgumentType.integer(1, 50)).executes(c -> {
                                      MallState st = MallState.get(c.getSource().getServer());
                                      st.night = IntegerArgumentType.getInteger(c, "n");
