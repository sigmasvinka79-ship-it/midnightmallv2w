          import net.minecraft.util.math.Vec3d;
          import net.minecraft.world.RaycastContext;
          import net.minecraft.world.World;

          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.Iterator;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Random;
          import java.util.UUID;

          /** Вся логика ночной смены: покупатели, касса, полки, посылки, аномалии, рассудок. */
          public final class MallManager {
              private MallManager() {}

              public enum AType {
                  LIGHTS("Короткое замыкание"),
                  PHONE("Звонок"),
                  PARCEL("Красная посылка"),
                  FACELESS("Безликий покупатель"),
                  MIMIC("Двойник"),
                  WATCHER("Смотрящий"),
                  CRAWLER("Ползун"),
                  HANGED("Висельник"),
                  CHASER("Гнилой");

                  public final String title;

                  AType(String title) {
                      this.title = title;
                  }
              }

              private record Return(RegistryKey<World> dim, double x, double y, double z, float yaw, float pitch) {}

              private static final class Customer {
                  MallNpcEntity e;
                  int state;
                  int shelf = -1;
                  int t;
                  int patience;
                  int maxPatience = 1000;
                  int browse = 50;
                  int want = 1;
                  int got = 0;
                  double speed = 1.0;
                  boolean impostor;
              }

              private static final class Anomaly {
                  AType type;
                  int start;
                  int deadline;
                  BlockPos pos;
                  MallNpcEntity ent;
                  MallNpcEntity extra;
                  int watched;
                  int hp;
                  int aux = -1;
                  int cool;
                  int hitCool;
                  int calm;
                  boolean seen;
              }

              private static final class Ghost {
                  MallNpcEntity e;
                  int until;
                  boolean seen;
              }

              private static final int ENTER = 0, SHOP = 1, BROWSE = 2, QUEUE = 3, LEAVE = 4;
              private static final int SHIFT_TICKS = 8400; // 7 минут
              private static final BlockState AIR = Blocks.AIR.getDefaultState();

              public static MinecraftServer server;
              public static boolean active = false;

              private static int now = 0;
              private static final Random RNG = new Random();

              private static int shiftStart, shiftEnd, night = 1;
              private static int nextCustomer, nextAnomaly, nextParcel, nextLitter, nextFlicker, nextAmbient;
              private static int satisfaction = 100, earned, served, angry, solved, failed;

              private static final Map<UUID, Integer> sanity = new HashMap<>();
              private static final Map<UUID, Return> returns = new HashMap<>();
              private static final Map<UUID, Integer> sleepers = new HashMap<>();
              private static final Map<UUID, Integer> pendingLeave = new HashMap<>();
              private static final int[] stock = new int[MallBuilder.SHELVES.size()];
              private static final List<Customer> customers = new ArrayList<>();
              private static final List<Customer> queue = new ArrayList<>();
              private static final List<Anomaly> anomalies = new ArrayList<>();
              private static final List<Ghost> ghosts = new ArrayList<>();
              private static final Map<BlockPos, Integer> flicker = new HashMap<>();
              private static final List<BlockPos> parcels = new ArrayList<>();
              private static final List<BlockPos> litter = new ArrayList<>();
              private static ServerBossBar bar;

              private static final int[] GHOST_SKINS = {20, 21, 22, 23, 30, 40, 42, 50};

              // ================= события =================

              public static void onStart() {
                  try {
                      ServerWorld mall = server.getWorld(MidnightMall.MALL);
                      MallState st = MallState.get(server);
                      if (mall != null && st.generated && st.lightsOut) {
                          MallBuilder.setLights(mall, true);
                          st.lightsOut = false;
                          st.markDirty();
                      }
                  } catch (Exception ignored) {
                  }
              }

              public static void onStop() {
                  try {
                      if (active) endShift(false, "Сервер закрывается.");
                  } catch (Exception ignored) {
                  }
              }

              public static void onJoin(ServerPlayerEntity p, MinecraftServer s) {
                  server = s;
                  if (inMall(p) && !sanity.containsKey(p.getUuid())) {
                      pendingLeave.put(p.getUuid(), now + 20);
                  }
              }

              public static void onDisconnect(ServerPlayerEntity p) {
                  sanity.remove(p.getUuid());
                  returns.remove(p.getUuid());
                  sleepers.remove(p.getUuid());
                  if (bar != null) bar.removePlayer(p);
              }

              public static void onSleep(ServerPlayerEntity p) {
                  MinecraftServer s = p.getServer();
                  if (s == null || inMall(p)) return;
                  if (!MallState.get(s).autoSleep) return;
                  sleepers.put(p.getUuid(), now + 60);
              }

              public static void onEntityLoad(Entity e, ServerWorld w) {
                  if (!w.getRegistryKey().equals(MidnightMall.MALL)) return;
                  if (e instanceof MallNpcEntity n) {
                      if (!n.managed) n.discard();
                      return;
                  }
                  SpawnGroup g = e.getType().getSpawnGroup();
                  if (g == SpawnGroup.MONSTER || g == SpawnGroup.AMBIENT) e.discard();
              }

              public static boolean inMall(ServerPlayerEntity p) {
                  return p.getServerWorld().getRegistryKey().equals(MidnightMall.MALL);
              }

              // ================= вход / выход =================

              public static void join(ServerPlayerEntity p) {
                  if (server == null) server = p.getServer();
                  ServerWorld mall = server.getWorld(MidnightMall.MALL);
                  if (mall == null) {
                      p.sendMessage(Text.literal("Измерение торгового центра не загружено.").formatted(Formatting.RED), false);
                      return;
                  }
                  MallState st = MallState.get(server);
                  if (!st.generated) {
                      p.sendMessage(Text.literal("Строю торговый центр, подождите несколько секунд...").formatted(Formatting.GRAY), false);
                      MallBuilder.build(mall);
                      st.generated = true;
                      st.markDirty();
                  }
                  if (!active) beginShift(mall, st);

                  returns.put(p.getUuid(), new Return(p.getServerWorld().getRegistryKey(),
                          p.getX(), p.getY(), p.getZ(), p.getYaw(), p.getPitch()));
                  sanity.put(p.getUuid(), 100);
                  if (p.isSleeping()) p.wakeUp(false, true);
                  tp(p, MidnightMall.MALL, MallBuilder.SPAWN.x, MallBuilder.SPAWN.y, MallBuilder.SPAWN.z, 0f, 0f);
                  bar.addPlayer(p);
                  p.getInventory().offerOrDrop(new ItemStack(MallItems.GOODS_BOX, 2));

                  p.sendMessage(Text.literal("☾ Ночь " + night + ". Вы просыпаетесь за кассой. Долг: $" + st.debt)
                          .formatted(Formatting.DARK_PURPLE), false);
                  if (night <= 2) rules(p);
                  else p.sendMessage(Text.literal("Правила смены: /mall rules").formatted(Formatting.GRAY), false);
              }

              public static void leave(ServerPlayerEntity p) {
                  Return r = returns.remove(p.getUuid());
                  sanity.remove(p.getUuid());
                  if (bar != null) bar.removePlayer(p);
                  if (r != null) {
                      tp(p, r.dim(), r.x(), r.y(), r.z(), r.yaw(), r.pitch());
                  } else {
                      BlockPos sp = server.getOverworld().getSpawnPos();
                      tp(p, World.OVERWORLD, sp.getX() + 0.5, sp.getY(), sp.getZ() + 0.5, 0f, 0f);
                  }
              }

              private static void tp(ServerPlayerEntity p, RegistryKey<World> dim, double x, double y, double z, float yaw, float pitch) {
