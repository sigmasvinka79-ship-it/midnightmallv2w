                                      c.getSource().sendFeedback(() -> Text.literal("Следующая смена: ночь " + st.night), false);
                                      return 1;
                                  })))
                          .then(CommandManager.literal("end").requires(s -> s.hasPermissionLevel(2)).executes(c -> {
                              MallManager.endShift(true);
                              return 1;
                          }))
                          .then(CommandManager.literal("reset").requires(s -> s.hasPermissionLevel(2)).executes(c -> {
                              MallState st = MallState.get(c.getSource().getServer());
                              st.night = 1;
                              st.debt = 2400;
                              st.cycles = 0;
                              st.markDirty();
                              c.getSource().sendFeedback(() -> Text.literal("Прогресс сброшен: ночь 1, долг $2400."), false);
                              return 1;
