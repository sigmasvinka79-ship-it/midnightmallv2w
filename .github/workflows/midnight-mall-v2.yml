              // ================= посылки и мусор =================

              private static BlockPos freeDock(ServerWorld mall) {
                  List<BlockPos> spots = new ArrayList<>();
                  Collections.addAll(spots, MallBuilder.DOCK);
                  Collections.shuffle(spots, RNG);
                  for (BlockPos b : spots) {
                      if (mall.getBlockState(b).isAir() && !parcels.contains(b)) return b;
                  }
                  return null;
              }

              private static int freeDockCount(ServerWorld mall) {
                  int n = 0;
                  for (BlockPos b : MallBuilder.DOCK) if (mall.getBlockState(b).isAir()) n++;
                  return n;
              }

              private static void spawnParcel() {
                  ServerWorld mall = server.getWorld(MidnightMall.MALL);
                  if (mall == null || freeDockCount(mall) < 2) return;
                  BlockPos b = freeDock(mall);
                  if (b == null) return;
                  mall.setBlockState(b, MallBlocks.PARCEL.getDefaultState(), 3);
                  parcels.add(b);
                  broadcast(Text.literal("📦 В подвал пришла посылка.").formatted(Formatting.AQUA), true);
              }

              private static void spawnLitter(ServerWorld mall) {
                  if (litter.size() >= 8) return;
                  for (int tries = 0; tries < 10; tries++) {
                      int x;
                      int z;
                      if (RNG.nextBoolean()) {
                          x = 14 + RNG.nextInt(52);
                          z = 24 + RNG.nextInt(12);
                      } else {
                          x = 30 + RNG.nextInt(20);
                          z = 3 + RNG.nextInt(19);
                      }
                      BlockPos p = new BlockPos(x, 64, z);
                      if (mall.getBlockState(p).isAir() && mall.getBlockState(p.down()).isSolidBlock(mall, p.down())) {
                          mall.setBlockState(p, MallBlocks.LITTER.getDefaultState(), 3);
                          litter.add(p);
                          return;
                      }
                  }
              }

              // ================= аномалии =================

              private static boolean has(AType t) {
                  return firstOf(t) != null;
              }

              private static Anomaly firstOf(AType t) {
                  for (Anomaly a : anomalies) if (a.type == t) return a;
                  return null;
              }

              private static Anomaly anomalyAt(AType t, BlockPos pos) {
                  for (Anomaly a : anomalies) if (a.type == t && a.pos != null && a.pos.equals(pos)) return a;
                  return null;
              }

              private static Anomaly anomalyOfEnt(Entity e) {
                  for (Anomaly a : anomalies) if (a.ent == e) return a;
                  return null;
              }

              public static boolean forceAnomaly(String name) {
                  if (!active) return false;
                  ServerWorld mall = server.getWorld(MidnightMall.MALL);
                  if (mall == null) return false;
                  for (AType t : AType.values()) {
                      if (t.name().equalsIgnoreCase(name)) {
                          if (has(t)) return false;
                          return startAnomaly(t, mall, players());
                      }
                  }
                  return false;
              }

              private static void startRandomAnomaly(ServerWorld mall, List<ServerPlayerEntity> ps) {
                  int maxActive = night >= 5 ? 2 : 1;
                  if (anomalies.size() >= maxActive || ps.isEmpty()) return;
                  List<AType> pool = new ArrayList<>();
                  pool.add(AType.LIGHTS);
                  pool.add(AType.PHONE);
                  pool.add(AType.PARCEL);
                  if (night >= 2) pool.add(AType.FACELESS);
                  if (night >= 3) {
                      pool.add(AType.WATCHER);
                      pool.add(AType.MIMIC);
                  }
                  if (night >= 4) pool.add(AType.CRAWLER);
                  if (night >= 5) pool.add(AType.HANGED);
                  if (night >= 6) pool.add(AType.CHASER);
                  pool.removeIf(MallManager::has);
                  if (pool.isEmpty()) return;
                  startAnomaly(pool.get(RNG.nextInt(pool.size())), mall, ps);
              }

              private static boolean startAnomaly(AType t, ServerWorld mall, List<ServerPlayerEntity> ps) {
                  if (ps.isEmpty()) return false;
                  Anomaly a = new Anomaly();
                  a.type = t;
                  a.start = now;
                  switch (t) {
                      case LIGHTS -> {
                          a.deadline = now + 1500;
                          MallBuilder.setLights(mall, false);
                          flicker.clear();
                          MallState st = MallState.get(server);
                          st.lightsOut = true;
                          st.markDirty();
                          broadcast(Text.literal("⚡ Погас свет! Щиток в подвале, у южной стены.").formatted(Formatting.YELLOW), false);
                          for (ServerPlayerEntity p : ps) {
                              Fx.sound(mall, p.getX(), p.getY(), p.getZ(), SoundEvents.BLOCK_BEACON_DEACTIVATE, 1f, 0.7f);
                          }
                          for (Customer c : new ArrayList<>(customers)) {
                              if (!c.impostor && c.state != LEAVE && RNG.nextInt(100) < 60) panicLeave(c);
                          }
                          if (night >= 3) {
                              ServerPlayerEntity target = ps.get(RNG.nextInt(ps.size()));
                              a.extra = spawnNpc(mall, 41, pickWatchSpot(target), 0f);
                          }
                      }
                      case PHONE -> {
                          a.deadline = now + 700;
                          broadcast(Text.literal("☎ За кассой звонит телефон...").formatted(Formatting.LIGHT_PURPLE), true);
                      }
                      case PARCEL -> {
                          BlockPos spot = freeDock(mall);
                          if (spot == null) return false;
                          a.pos = spot;
                          a.deadline = now + 1800;
                          mall.setBlockState(spot, MallBlocks.PARCEL_CURSED.getDefaultState(), 3);
                          broadcast(Text.literal("📦 В подвале появилась красная посылка.").formatted(Formatting.RED), true);
                      }
                      case FACELESS -> {
                          a.deadline = now + 1800;
                          a.ent = spawnNpc(mall, 8 + RNG.nextInt(3), door(), 90f);
                          addImpostor(a.ent);
                          broadcast(Text.literal("Один из покупателей выглядит... неправильно.").formatted(Formatting.DARK_GRAY), true);
                      }
                      case MIMIC -> {
                          a.deadline = now + 1800;
                          a.ent = spawnNpc(mall, RNG.nextInt(8), door(), 90f);
                          addImpostor(a.ent);
                          broadcast(Text.literal("Кто-то встал в очередь, ничего не выбрав.").formatted(Formatting.DARK_GRAY), true);
                      }
                      case WATCHER -> {
                          a.deadline = Integer.MAX_VALUE;
                          ServerPlayerEntity target = ps.get(RNG.nextInt(ps.size()));
                          a.ent = spawnNpc(mall, RNG.nextBoolean() ? 40 : 42, pickWatchSpot(target), 0f);
                          Fx.sound(mall, target.getX(), target.getY(), target.getZ(), SoundEvents.ENTITY_ENDERMAN_STARE, 0.6f, 0.5f);
                      }
                      case CRAWLER -> {
                          a.deadline = now + 1500;
                          a.hp = 2;
                          a.ent = spawnNpc(mall, RNG.nextBoolean() ? 50 : 51, MallBuilder.VENT_SPOT, 0f);
                          broadcast(Text.literal("Из вентиляции донёсся скрежет...").formatted(Formatting.DARK_GRAY), true);
                          Fx.sound(mall, MallBuilder.VENT_SPOT.x, MallBuilder.VENT_SPOT.y, MallBuilder.VENT_SPOT.z, SoundEvents.BLOCK_IRON_TRAPDOOR_OPEN, 1f, 0.5f);
                      }
                      case HANGED -> {
                          a.deadline = now + 1800;
                          Vec3d h = MallBuilder.HANG_SPOTS[RNG.nextInt(MallBuilder.HANG_SPOTS.length)];
                          a.ent = spawnNpc(mall, 31, h, 0f);
                          a.ent.setNoGravity(true);
                          broadcast(Text.literal("Под потолком что-то скрипит...").formatted(Formatting.DARK_GRAY), true);
                      }
                      case CHASER -> {
                          a.deadline = now + 1500;
                          a.hp = 3;
                          ServerPlayerEntity target = ps.get(RNG.nextInt(ps.size()));
                          a.ent = spawnNpc(mall, 20 + RNG.nextInt(4), pickWatchSpot(target), 0f);
                          broadcast(Text.literal("Кто-то идёт за вами. Быстро.").formatted(Formatting.DARK_RED), true);
                      }
                  }
                  anomalies.add(a);
                  return true;
              }

              private static void addImpostor(MallNpcEntity e) {
                  Customer c = new Customer();
                  c.e = e;
                  c.impostor = true;
                  c.state = QUEUE;
                  customers.add(c);
                  queue.add(c);
              }

              private static Vec3d pickWatchSpot(ServerPlayerEntity p) {
                  Vec3d[] spots = MallBuilder.WATCH_SPOTS[MallBuilder.floorOf(p.getY())];
                  List<Vec3d> far = new ArrayList<>();
                  Vec3d best = spots[0];
                  double bestD = -1;
                  for (Vec3d s : spots) {
                      double d = s.distanceTo(p.getPos());
                      if (d >= 16) far.add(s);
                      if (d > bestD) {
                          bestD = d;
                          best = s;
                      }
                  }
                  return far.isEmpty() ? best : far.get(RNG.nextInt(far.size()));
              }

              private static boolean looking(ServerPlayerEntity p, Entity e) {
                  Vec3d eye = p.getEyePos();
                  Vec3d target = e.getEyePos();
                  Vec3d to = target.subtract(eye);
                  if (to.length() > 48) return false;
                  if (p.getRotationVec(1.0f).dotProduct(to.normalize()) < 0.88) return false;
                  BlockHitResult r = p.getServerWorld().raycast(new RaycastContext(
                          eye, target, RaycastContext.ShapeType.COLLIDER, RaycastContext.FluidHandling.NONE, p));
                  return r.getType() == HitResult.Type.MISS;
              }

              private static void tickAnomalies(ServerWorld mall, List<ServerPlayerEntity> ps) {
                  for (Anomaly a : new ArrayList<>(anomalies)) {
                      if (!anomalies.contains(a)) continue;
                      switch (a.type) {
                          case LIGHTS -> {
                              if (now % 20 == 0) {
                                  BlockPos b = MallBuilder.BREAKER[1];
                                  mall.spawnParticles(ParticleTypes.ELECTRIC_SPARK, b.getX() + 0.5, b.getY() + 1.2, b.getZ() + 0.5, 8, 0.3, 0.3, 0.3, 0.05);
                                  Fx.sound(mall, b.getX() + 0.5, b.getY(), b.getZ() + 0.5, SoundEvents.BLOCK_REDSTONE_TORCH_BURNOUT, 0.8f, 1.2f);
                              }
                              tickShadow(a, mall, ps);
                              if (now >= a.deadline) resolve(a, false, mall);
                          }
                          case PHONE -> {
                              if (now % 40 == 0) {
                                  BlockPos b = MallBuilder.PHONE;
                                  Fx.sound(mall, b.getX() + 0.5, b.getY(), b.getZ() + 0.5, SoundEvents.BLOCK_BELL_USE, 1.5f, 1.4f);
                                  mall.spawnParticles(ParticleTypes.NOTE, b.getX() + 0.5, b.getY() + 1.2, b.getZ() + 0.5, 2, 0.3, 0.2, 0.3, 0.0);
                              }
                              if (now >= a.deadline) resolve(a, false, mall);
                          }
                          case PARCEL -> {
                              if (now % 10 == 0) {
                                  mall.spawnParticles(ParticleTypes.SOUL, a.pos.getX() + 0.5, a.pos.getY() + 1.1, a.pos.getZ() + 0.5, 2, 0.25, 0.25, 0.25, 0.01);
                              }
                              if (now % 100 == 0) {
                                  Fx.sound(mall, a.pos.getX() + 0.5, a.pos.getY(), a.pos.getZ() + 0.5, SoundEvents.ENTITY_VEX_AMBIENT, 0.9f, 0.6f);
                              }
                              if (now >= a.deadline) resolve(a, false, mall);
                          }
                          case FACELESS, MIMIC -> {
                              if (a.ent == null || a.ent.isRemoved()) {
                                  anomalies.remove(a);
                              } else if (now >= a.deadline) {
                                  resolve(a, false, mall);
                              }
                          }
                          case WATCHER -> tickWatcher(a, mall, ps);
                          case CRAWLER -> tickCrawler(a, mall);
                          case HANGED -> tickHanged(a, mall, ps);
                          case CHASER -> tickChaser(a, mall, ps);
                      }
                  }
              }

              /** Тень ходит только пока свет выключен. */
              private static void tickShadow(Anomaly a, ServerWorld mall, List<ServerPlayerEntity> ps) {
                  if (a.extra == null) return;
                  if (a.extra.isRemoved() || ps.isEmpty()) {
                      a.extra = null;
                      return;
                  }
                  ServerPlayerEntity n = nearest(ps, a.extra);
                  if (now % 6 == 0) a.extra.getNavigation().startMovingTo(n, 1.2);
                  a.extra.getLookControl().lookAt(n);
                  if (a.extra.squaredDistanceTo(n) < 4.0) {
                      changeSanity(-18);
                      Fx.sound(mall, n.getX(), n.getY(), n.getZ(), SoundEvents.ENTITY_ENDERMAN_SCREAM, 0.8f, 0.5f);
                      n.addStatusEffect(new StatusEffectInstance(StatusEffects.DARKNESS, 100, 0, false, false, false));
                      a.extra.discard();
                      a.extra = null;
                  }
              }

              private static void tickWatcher(Anomaly a, ServerWorld mall, List<ServerPlayerEntity> ps) {
                  if (a.ent == null || a.ent.isRemoved() || ps.isEmpty()) {
                      anomalies.remove(a);
                      return;
                  }
                  ServerPlayerEntity near = nearest(ps, a.ent);
                  boolean seen = false;
                  for (ServerPlayerEntity p : ps) {
                      if (looking(p, a.ent)) {
                          seen = true;
                          break;
                      }
                  }
                  a.ent.getLookControl().lookAt(near);
                  if (seen) {
                      a.watched++;
                      a.ent.getNavigation().stop();
                      a.ent.getMoveControl().moveTo(a.ent.getX(), a.ent.getY(), a.ent.getZ(), 0.0);
                      if (a.watched % 30 == 0) {
                          Fx.sound(mall, near.getX(), near.getY(), near.getZ(), SoundEvents.ENTITY_WARDEN_HEARTBEAT, 1f, 1f);
                      }
                      if (a.watched >= 120) {
                          resolve(a, true, mall);
                          return;
                      }
                  } else if (now % 6 == 0) {
                      a.ent.getNavigation().startMovingTo(near, 1.5);
                  }
                  if (a.ent.squaredDistanceTo(near) < 5.0) {
                      resolve(a, false, mall);
                  }
              }

              private static void tickCrawler(Anomaly a, ServerWorld mall) {
                  if (a.ent == null || a.ent.isRemoved()) {
                      anomalies.remove(a);
                      return;
                  }
                  if (now >= a.deadline) {
                      resolve(a, false, mall);
                      return;
                  }
                  if (a.aux < 0 || a.aux >= stock.length) a.aux = RNG.nextInt(stock.length);
                  Vec3d ap = MallBuilder.SHELVES.get(a.aux).approach();
                  if (now % 10 == 0) a.ent.getNavigation().startMovingTo(ap.x, ap.y, ap.z, 1.9);
                  if (a.ent.squaredDistanceTo(ap.x, ap.y, ap.z) < 4.0 && now >= a.cool) {
                      if (stock[a.aux] > 0) {
                          stock[a.aux] = 0;
                          MallBuilder.refreshShelf(mall, a.aux, 0);
                          Fx.sound(mall, ap.x, ap.y, ap.z, SoundEvents.ENTITY_SPIDER_AMBIENT, 1f, 0.6f);
                          broadcast(Text.literal("Ползун опустошил полку!").formatted(Formatting.RED), true);
                      }
                      a.cool = now + 50;
                      a.aux = RNG.nextInt(stock.length);
                  }
              }

              private static void tickHanged(Anomaly a, ServerWorld mall, List<ServerPlayerEntity> ps) {
                  if (a.ent == null || a.ent.isRemoved() || ps.isEmpty()) {
                      anomalies.remove(a);
                      return;
                  }
                  boolean seen = false;
                  for (ServerPlayerEntity p : ps) {
                      if (looking(p, a.ent)) {
                          seen = true;
                          break;
                      }
                  }
                  a.ent.getLookControl().lookAt(nearest(ps, a.ent));
                  if (seen) {
                      a.seen = true;
                      a.calm = 0;
                      if (now % 20 == 0) {
                          changeSanity(-1);
                          Fx.sound(mall, a.ent.getX(), a.ent.getY(), a.ent.getZ(), SoundEvents.AMBIENT_CAVE, 0.7f, 0.5f);
                      }
                  } else if (a.seen) {
                      a.calm++;
                      if (a.calm >= 300) {
                          resolve(a, true, mall);
                          return;
                      }
                  }
                  if (now >= a.deadline) {
                      if (a.seen) {
                          resolve(a, false, mall);
                      } else {
                          anomalies.remove(a);
                          cleanup(a, mall);
                      }
                  }
              }

              private static void tickChaser(Anomaly a, ServerWorld mall, List<ServerPlayerEntity> ps) {
                  if (a.ent == null || a.ent.isRemoved() || ps.isEmpty()) {
                      anomalies.remove(a);
                      return;
                  }
                  if (now >= a.deadline) {
                      resolve(a, false, mall);
                      return;
                  }
                  ServerPlayerEntity n = nearest(ps, a.ent);
                  if (now % 6 == 0) a.ent.getNavigation().startMovingTo(n, 1.25);
                  a.ent.getLookControl().lookAt(n);
                  if (a.ent.squaredDistanceTo(n) < 3.0 && now >= a.cool) {
                      a.cool = now + 60;
                      changeSanity(-8);
                      Fx.sound(mall, n.getX(), n.getY(), n.getZ(), SoundEvents.ENTITY_ZOMBIE_ATTACK_WOODEN_DOOR, 1f, 0.6f);
                      n.addStatusEffect(new StatusEffectInstance(StatusEffects.SLOWNESS, 30, 1, false, false, false));
                  }
              }

              private static void resolve(Anomaly a, boolean ok, ServerWorld mall) {
                  if (!anomalies.remove(a)) return;
                  cleanup(a, mall);
                  if (ok) {
                      solved++;
                      reward(20);
                      changeSanity(8);
                      broadcast(Text.literal("✔ " + a.type.title + ": вы справились. +$20").formatted(Formatting.GREEN), true);
                      for (ServerPlayerEntity p : players()) {
                          Fx.sound(mall, p.getX(), p.getY(), p.getZ(), SoundEvents.BLOCK_BEACON_ACTIVATE, 0.8f, 1.4f);
                      }
                  } else {
                      failed++;
                      int fine = switch (a.type) {
                          case LIGHTS, PARCEL -> 30;
                          case FACELESS, MIMIC -> 40;
                          case WATCHER -> 25;
                          case CRAWLER -> 20;
                          default -> 0;
                      };
                      int sanityLoss = switch (a.type) {
                          case LIGHTS, PARCEL -> 25;
                          case FACELESS, MIMIC -> 20;
                          case WATCHER -> 30;
                          case HANGED -> 15;
                          case CRAWLER, CHASER -> 10;
                          default -> 15;
                      };
                      changeSanity(-sanityLoss);
                      if (fine > 0) addDebt(fine);
                      broadcast(Text.literal("✖ " + a.type.title + ": вы не успели." + (fine > 0 ? " Штраф $" + fine : "")).formatted(Formatting.RED), true);
                      for (ServerPlayerEntity p : players()) {
                          Fx.sound(mall, p.getX(), p.getY(), p.getZ(), SoundEvents.ENTITY_ENDERMAN_SCREAM, 0.7f, 0.6f);
                          if (a.type == AType.WATCHER) {
                              p.addStatusEffect(new StatusEffectInstance(StatusEffects.DARKNESS, 120, 0, false, false, false));
                          }
                      }
                      if (a.type == AType.PARCEL && night >= 2 && !has(AType.CHASER)) {
                          startAnomaly(AType.CHASER, mall, players());
                      }
                  }
              }

              private static void cleanup(Anomaly a, ServerWorld mall) {
                  switch (a.type) {
                      case LIGHTS -> {
                          if (mall != null) MallBuilder.setLights(mall, true);
                          MallState st = MallState.get(server);
                          st.lightsOut = false;
                          st.markDirty();
                          if (a.extra != null && !a.extra.isRemoved()) a.extra.discard();
                          a.extra = null;
                      }
                      case PARCEL -> {
                          if (mall != null && a.pos != null) mall.setBlockState(a.pos, AIR, 3);
                      }
                      case FACELESS, MIMIC, WATCHER, CRAWLER, HANGED, CHASER -> {
                          if (a.ent != null && !a.ent.isRemoved()) {
                              if (mall != null) {
                                  mall.spawnParticles(ParticleTypes.LARGE_SMOKE, a.ent.getX(), a.ent.getY() + 1, a.ent.getZ(), 15, 0.3, 0.6, 0.3, 0.02);
                              }
                              Customer c = customerOf(a.ent);
                              if (c != null) queue.remove(c);
                              a.ent.discard();
                          }
                      }
                      default -> {
                      }
                  }
              }
          }
