          package com.midnightmall;

          import net.minecraft.nbt.NbtCompound;
          import net.minecraft.registry.RegistryWrapper;
          import net.minecraft.server.MinecraftServer;
          import net.minecraft.world.PersistentState;
          import net.minecraft.world.PersistentStateManager;

          public class MallState extends PersistentState {
              public int night = 1;
              public int debt = 2400;
              public int cycles = 0;
              public boolean generated = false;
              public boolean lightsOut = false;
              public boolean autoSleep = true;

              private static final PersistentState.Type<MallState> TYPE =
                      new PersistentState.Type<>(MallState::new, MallState::load, null);

              public static MallState get(MinecraftServer server) {
                  PersistentStateManager m = server.getOverworld().getPersistentStateManager();
                  return m.getOrCreate(TYPE, "midnightmall");
              }

              public static MallState load(NbtCompound nbt, RegistryWrapper.WrapperLookup lookup) {
                  MallState s = new MallState();
                  s.night = Math.max(1, nbt.getInt("night"));
                  s.debt = nbt.getInt("debt");
                  s.cycles = nbt.getInt("cycles");
                  s.generated = nbt.getBoolean("generated");
                  s.lightsOut = nbt.getBoolean("lightsOut");
                  s.autoSleep = !nbt.contains("autoSleep") || nbt.getBoolean("autoSleep");
                  return s;
              }

              @Override
              public NbtCompound writeNbt(NbtCompound nbt, RegistryWrapper.WrapperLookup lookup) {
                  nbt.putInt("night", night);
                  nbt.putInt("debt", debt);
                  nbt.putInt("cycles", cycles);
                  nbt.putBoolean("generated", generated);
                  nbt.putBoolean("lightsOut", lightsOut);
                  nbt.putBoolean("autoSleep", autoSleep);
                  return nbt;
              }
          }
