          package com.midnightmall;

          import net.fabricmc.fabric.api.entity.event.v1.EntitySleepEvents;
          import net.fabricmc.fabric.api.entity.event.v1.ServerLivingEntityEvents;
          import net.fabricmc.fabric.api.event.lifecycle.v1.ServerEntityEvents;
          import net.fabricmc.fabric.api.event.lifecycle.v1.ServerLifecycleEvents;
          import net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents;
          import net.fabricmc.fabric.api.event.player.AttackBlockCallback;
          import net.fabricmc.fabric.api.event.player.AttackEntityCallback;
          import net.fabricmc.fabric.api.event.player.UseBlockCallback;
          import net.fabricmc.fabric.api.networking.v1.ServerPlayConnectionEvents;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.server.network.ServerPlayerEntity;
          import net.minecraft.server.world.ServerWorld;
          import net.minecraft.util.ActionResult;
          import net.minecraft.util.Hand;
          import net.minecraft.util.hit.BlockHitResult;
          import net.minecraft.util.hit.EntityHitResult;
          import net.minecraft.util.math.BlockPos;
          import net.minecraft.util.math.Direction;
          import net.minecraft.world.World;

          public final class MallEvents {
              private MallEvents() {}

              public static void init() {
                  ServerLifecycleEvents.SERVER_STARTED.register(s -> {
                      MallManager.server = s;
                      MallManager.onStart();
                  });
                  ServerLifecycleEvents.SERVER_STOPPING.register(s -> MallManager.onStop());
                  ServerTickEvents.END_SERVER_TICK.register(MallManager::tick);
                  ServerPlayConnectionEvents.JOIN.register((handler, sender, server) -> MallManager.onJoin(handler.player, server));
                  ServerPlayConnectionEvents.DISCONNECT.register((handler, server) -> MallManager.onDisconnect(handler.player));
                  EntitySleepEvents.START_SLEEPING.register((entity, pos) -> {
                      if (entity instanceof ServerPlayerEntity sp) MallManager.onSleep(sp);
                  });
                  // В торговом центре игроки не получают урона: здоровье заменяет рассудок.
                  ServerLivingEntityEvents.ALLOW_DAMAGE.register((entity, source, amount) ->
                          !(entity instanceof ServerPlayerEntity sp && MallManager.inMall(sp)));
                  ServerEntityEvents.ENTITY_LOAD.register(MallManager::onEntityLoad);

                  UseBlockCallback.EVENT.register(MallEvents::useBlock);
                  AttackBlockCallback.EVENT.register(MallEvents::attackBlock);
                  AttackEntityCallback.EVENT.register(MallEvents::attackEntity);
              }

              private static boolean inMallWorld(World world) {
                  return world.getRegistryKey().equals(MidnightMall.MALL);
              }

              private static ActionResult useBlock(PlayerEntity player, World world, Hand hand, BlockHitResult hit) {
                  if (!inMallWorld(world) || player.isCreative() || player.isSpectator()) return ActionResult.PASS;
                  if (hand != Hand.MAIN_HAND) return ActionResult.FAIL;
                  if (!world.isClient && player instanceof ServerPlayerEntity sp && world instanceof ServerWorld sw) {
                      MallManager.useBlock(sp, sw, hit.getBlockPos());
                  }
                  return ActionResult.SUCCESS;
              }

              private static ActionResult attackBlock(PlayerEntity player, World world, Hand hand, BlockPos pos, Direction dir) {
                  if (!inMallWorld(world) || player.isCreative() || player.isSpectator()) return ActionResult.PASS;
                  if (!world.isClient && player instanceof ServerPlayerEntity sp && world instanceof ServerWorld sw) {
                      MallManager.attackBlock(sp, sw, pos);
                  }
                  return ActionResult.SUCCESS;
              }

              private static ActionResult attackEntity(PlayerEntity player, World world, Hand hand, Entity entity, EntityHitResult hit) {
                  if (!inMallWorld(world) || player.isCreative() || player.isSpectator()) return ActionResult.PASS;
                  if (!(entity instanceof MallNpcEntity npc)) return ActionResult.PASS;
                  if (!world.isClient && player instanceof ServerPlayerEntity sp) {
                      MallManager.hitNpc(sp, npc);
                  }
                  return ActionResult.SUCCESS;
              }
          }
