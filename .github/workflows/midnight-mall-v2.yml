          #!/usr/bin/env python3
          """Генератор ассетов Midnight Mall: процедурные текстуры, модели, блокстейты, языки, MallBlocks/MallSkins."""
          import os, sys, zlib, struct, math, random, json

          ROOT = sys.argv[1] if len(sys.argv) > 1 else '.'
          RES = os.path.join(ROOT, 'src/main/resources')
          JAVA = os.path.join(ROOT, 'src/main/java/com/midnightmall')
          AS = os.path.join(RES, 'assets/midnightmall')
          TB, TE, TI = [os.path.join(AS, 'textures', d) for d in ('block', 'entity', 'item')]
          for d in (TB, TE, TI, os.path.join(AS, 'models/block'), os.path.join(AS, 'models/item'),
                    os.path.join(AS, 'blockstates'), os.path.join(AS, 'lang'), JAVA):
              os.makedirs(d, exist_ok=True)

          # ---------------------------------------------------------------- PNG / рисование
          def write_png(path, w, h, rows):
              raw = bytearray()
              for row in rows:
                  raw.append(0)
                  for (r, g, b, a) in row:
                      raw += bytes((r, g, b, a))
              def chunk(t, d):
                  c = struct.pack('>I', len(d)) + t + d
                  return c + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
              data = (b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0))
                      + chunk(b'IDAT', zlib.compress(bytes(raw), 9)) + chunk(b'IEND', b''))
              with open(path, 'wb') as f:
                  f.write(data)

          class Img:
              def __init__(s, w, h, fill=(0, 0, 0, 0)):
                  s.w, s.h = w, h
                  s.p = [[fill] * w for _ in range(h)]
              def set(s, x, y, c):
                  if 0 <= x < s.w and 0 <= y < s.h:
                      s.p[y][x] = c if len(c) == 4 else (c[0], c[1], c[2], 255)
              def get(s, x, y):
                  return s.p[y][x]
              def rect(s, x, y, w, h, c):
                  for yy in range(y, y + h):
                      for xx in range(x, x + w):
                          s.set(xx, yy, c)
              def save(s, path):
                  write_png(path, s.w, s.h, s.p)

          def hsh(x, y, seed):
              n = (x * 374761393 + y * 668265263 + seed * 1442695041) & 0xffffffff
              n = ((n ^ (n >> 13)) * 1274126177) & 0xffffffff
              return ((n ^ (n >> 16)) & 0xffff) / 65535.0

          def vnoise(x, y, seed, sc=4):
              gx, gy = x / sc, y / sc
              x0, y0 = int(math.floor(gx)), int(math.floor(gy))
              fx, fy = gx - x0, gy - y0
              fx, fy = fx * fx * (3 - 2 * fx), fy * fy * (3 - 2 * fy)
              a, b = hsh(x0, y0, seed), hsh(x0 + 1, y0, seed)
              c, d = hsh(x0, y0 + 1, seed), hsh(x0 + 1, y0 + 1, seed)
              return (a * (1 - fx) + b * fx) * (1 - fy) + (c * (1 - fx) + d * fx) * fy

          def clamp(v):
              return max(0, min(255, int(v)))

          def shade(c, f):
              return (clamp(c[0] * f), clamp(c[1] * f), clamp(c[2] * f)) + tuple(c[3:])

          def mix(a, b, t):
              return tuple(clamp(a[i] * (1 - t) + b[i] * t) for i in range(3))

          def noisy(c, x, y, seed, amp=0.18, sc=3):
              f = 1 + (vnoise(x, y, seed, sc) - 0.5) * amp * 2 + (hsh(x, y, seed + 7) - 0.5) * amp
              return shade(c, f)

          def fill_noise(im, c, seed, amp=0.18, sc=3, x0=0, y0=0, x1=None, y1=None):
              x1 = im.w if x1 is None else x1
              y1 = im.h if y1 is None else y1
              for y in range(y0, y1):
                  for x in range(x0, x1):
                      im.set(x, y, noisy(c, x, y, seed, amp, sc))

          def blob(im, cx, cy, r, color, strength, seed):
              for y in range(im.h):
                  for x in range(im.w):
                      d = math.hypot(x - cx, y - cy) + (hsh(x, y, seed) - 0.5) * 2
                      if d < r:
                          t = strength * (1 - d / r)
                          old = im.get(x, y)
                          if old[3] > 0:
                              im.set(x, y, mix(old, color, min(1, t * 1.6)) + (old[3],))

          def crack(im, seed, color=(25, 22, 20)):
              rnd = random.Random(seed)
              x, y = rnd.randint(2, im.w - 3), rnd.randint(0, 3)
              for _ in range(im.h + 4):
                  im.set(x, y, color)
                  y += 1
                  x += rnd.choice((-1, 0, 0, 1))
                  if rnd.random() < 0.15:
                      im.set(x + rnd.choice((-1, 1)), y, color)

          # ---------------------------------------------------------------- текстуры блоков
          def tile(base, grout, seed, wear=0.10):
              im = Img(16, 16)
              for y in range(16):
                  for x in range(16):
                      if x % 8 == 0 or y % 8 == 0:
