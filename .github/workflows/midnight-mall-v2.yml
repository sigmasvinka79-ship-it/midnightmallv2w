              // ================= смена =================

              private static void beginShift(ServerWorld mall, MallState st) {
                  active = true;
                  night = st.night;
                  shiftStart = now;
                  shiftEnd = now + SHIFT_TICKS;
                  satisfaction = 100;
                  earned = 0;
                  served = 0;
                  angry = 0;
                  solved = 0;
                  failed = 0;
                  customers.clear();
                  queue.clear();
                  anomalies.clear();
                  ghosts.clear();
                  flicker.clear();
                  parcels.clear();
                  litter.clear();
                  Arrays.fill(stock, 2);
                  MallBuilder.dress(mall, night);
                  for (int i = 0; i < stock.length; i++) MallBuilder.refreshShelf(mall, i, stock[i]);
                  for (BlockPos d : MallBuilder.DOCK) mall.setBlockState(d, AIR, 3);
                  if (st.lightsOut) {
                      MallBuilder.setLights(mall, true);
                      st.lightsOut = false;
                      st.markDirty();
                  }
                  nextCustomer = now + 100;
                  nextAnomaly = now + 700 + RNG.nextInt(300);
                  nextParcel = now + 160;
                  nextLitter = now + 400;
                  nextFlicker = now + 300;
                  nextAmbient = now + 400;
                  bar = new ServerBossBar(Text.literal("Смена"), BossBar.Color.PURPLE, BossBar.Style.PROGRESS);
              }

              public static void endShift(boolean completed) {
                  endShift(completed, null);
              }

              public static void endShift(boolean completed, String reason) {
                  if (!active) return;
                  active = false;
                  MinecraftServer s = server;
                  ServerWorld mall = s.getWorld(MidnightMall.MALL);
                  MallState st = MallState.get(s);

                  for (Anomaly a : new ArrayList<>(anomalies)) cleanup(a, mall);
                  anomalies.clear();
                  for (Ghost g : ghosts) if (!g.e.isRemoved()) g.e.discard();
                  ghosts.clear();
                  if (mall != null) {
                      MallBuilder.setLights(mall, true);
                      for (Customer c : customers) {
                          if (!c.e.isRemoved()) c.e.discard();
                      }
                      for (BlockPos d : MallBuilder.DOCK) mall.setBlockState(d, AIR, 3);
                      for (BlockPos p : litter) {
                          if (mall.getBlockState(p).isOf(MallBlocks.LITTER)) mall.setBlockState(p, AIR, 3);
                      }
                  }
                  st.lightsOut = false;
                  customers.clear();
                  queue.clear();
                  flicker.clear();
                  parcels.clear();
                  litter.clear();

                  int bonus = completed ? satisfaction * 60 / 100 : 0;
                  int penalty = completed ? 0 : 100;
                  st.debt = Math.max(0, st.debt - bonus) + penalty;
                  boolean won = st.debt <= 0;
                  int doneNight = night;
                  if (completed && !won) st.night = night + 1;

                  List<Text> report = new ArrayList<>();
                  if (completed) {
                      report.add(Text.literal("☀ Смена окончена (ночь " + doneNight + ").").formatted(Formatting.GOLD));
                  } else {
                      report.add(Text.literal("✖ Смена прервана. " + (reason == null ? "" : reason) + " Штраф: $100.").formatted(Formatting.RED));
                  }
                  report.add(Text.literal("Обслужено: " + served + " • недовольных: " + angry + " • аномалий отражено: " + solved
                          + ", пропущено: " + failed).formatted(Formatting.GRAY));
                  if (completed) report.add(Text.literal("Бонус за довольство покупателей: $" + bonus).formatted(Formatting.GRAY));
                  if (won) {
                      st.cycles++;
                      st.debt = 3000 + 600 * st.cycles;
                      st.night = 1;
                      report.add(Text.literal("★ ДОЛГ ВЫПЛАЧЕН. Ты свободен... но магазин ночью снова откроет двери (новый долг: $" + st.debt + ").")
                              .formatted(Formatting.GREEN, Formatting.BOLD));
                  } else {
                      report.add(Text.literal("Остаток долга: $" + st.debt).formatted(Formatting.YELLOW));
                  }
                  st.markDirty();

                  for (UUID id : new ArrayList<>(sanity.keySet())) {
                      ServerPlayerEntity p = s.getPlayerManager().getPlayer(id);
                      if (p == null) continue;
                      for (Text t : report) p.sendMessage(t, false);
                      leave(p);
                  }
                  sanity.clear();
                  returns.clear();
                  if (bar != null) bar.clearPlayers();

                  long t = s.getOverworld().getTimeOfDay() % 24000L;
                  if (t >= 12000L) {
                      s.getCommandManager().executeWithPrefix(s.getCommandSource().withSilent(), "time add " + (24000L - t + 1000L));
                  }
              }

              // ================= главный тик =================

              public static void tick(MinecraftServer s) {
                  server = s;
                  now++;

                  if (!sleepers.isEmpty()) {
                      List<UUID> due = new ArrayList<>();
                      for (Map.Entry<UUID, Integer> en : sleepers.entrySet()) {
                          if (now >= en.getValue()) due.add(en.getKey());
                      }
                      for (UUID id : due) {
                          sleepers.remove(id);
                          ServerPlayerEntity p = s.getPlayerManager().getPlayer(id);
                          if (p != null && p.isSleeping() && !inMall(p)) join(p);
                      }
                  }
                  if (!pendingLeave.isEmpty()) {
                      List<UUID> due = new ArrayList<>();
                      for (Map.Entry<UUID, Integer> en : pendingLeave.entrySet()) {
                          if (now >= en.getValue()) due.add(en.getKey());
                      }
                      for (UUID id : due) {
                          pendingLeave.remove(id);
                          ServerPlayerEntity p = s.getPlayerManager().getPlayer(id);
                          if (p != null && inMall(p) && !sanity.containsKey(id)) leave(p);
                      }
                  }

                  if (!active) return;
                  ServerWorld mall = s.getWorld(MidnightMall.MALL);
                  if (mall == null) {
                      endShift(false, "Измерение недоступно.");
                      return;
                  }
                  List<ServerPlayerEntity> ps = players();
                  if (ps.isEmpty() && now - shiftStart > 60) {
                      endShift(false, "Все ушли со смены.");
                      return;
                  }
                  MallState st = MallState.get(s);
                  if (st.debt <= 0) {
                      endShift(true);
                      return;
                  }
                  int left = shiftEnd - now;
                  if (left <= 0) {
                      endShift(true);
                      return;
                  }
                  for (int v : sanity.values()) {
                      if (v <= 0) {
                          endShift(false, "Вы потеряли сознание от страха.");
                          return;
                      }
                  }

                  if (now % 20 == 0) hud(ps, st, left);

                  if (now >= nextCustomer && customers.size() < 6) {
                      spawnCustomer(mall);
                      nextCustomer = now + Math.max(180, 380 - night * 25);
                  }
                  tickCustomers(mall);

                  if (now >= nextAnomaly) {
                      startRandomAnomaly(mall, ps);
                      nextAnomaly = now + Math.max(500, 1100 - night * 80) + RNG.nextInt(300);
                  }
                  tickAnomalies(mall, ps);

                  if (now >= nextParcel) {
                      spawnParcel();
                      nextParcel = now + 900 + RNG.nextInt(400);
                  }
                  if (now >= nextLitter) {
                      spawnLitter(mall);
                      nextLitter = now + 500 + RNG.nextInt(400);
                  }
                  if (now % 20 == 0) {
                      tickSanity(mall, ps);
                      tickGhosts(mall, ps);
                  }
                  tickAtmosphere(mall, ps);
              }

              private static List<ServerPlayerEntity> players() {
                  List<ServerPlayerEntity> list = new ArrayList<>();
                  for (ServerPlayerEntity p : server.getPlayerManager().getPlayerList()) {
                      if (sanity.containsKey(p.getUuid()) && inMall(p)) list.add(p);
                  }
                  return list;
              }

              private static void broadcast(Text t, boolean overlay) {
                  for (ServerPlayerEntity p : players()) p.sendMessage(t, overlay);
              }

              private static ServerPlayerEntity nearest(List<ServerPlayerEntity> ps, Entity e) {
                  ServerPlayerEntity best = ps.get(0);
                  for (ServerPlayerEntity p : ps) {
                      if (p.squaredDistanceTo(e) < best.squaredDistanceTo(e)) best = p;
                  }
                  return best;
              }

              private static void hud(List<ServerPlayerEntity> ps, MallState st, int left) {
                  int sec = left / 20;
                  bar.setName(Text.literal(String.format(Locale.ROOT, "Ночь %d  •  до конца смены %d:%02d", night, sec / 60, sec % 60)));
                  bar.setPercent(Math.max(0f, Math.min(1f, left / (float) SHIFT_TICKS)));
                  for (ServerPlayerEntity p : ps) {
                      int sn = sanity.getOrDefault(p.getUuid(), 0);
                      Formatting col = sn >= 60 ? Formatting.GREEN : (sn >= 30 ? Formatting.YELLOW : Formatting.RED);
                      p.sendMessage(Text.literal(String.format(Locale.ROOT, "Долг: $%d   Рассудок: %d%%   Довольство: %d%%",
                              st.debt, sn, satisfaction)).formatted(col), true);
                  }
              }

              // ================= экономика / рассудок =================

              private static void reward(int amount) {
                  MallState st = MallState.get(server);
                  st.debt = Math.max(0, st.debt - amount);
                  st.markDirty();
                  earned += amount;
              }

              private static void addDebt(int amount) {
                  MallState st = MallState.get(server);
                  st.debt += amount;
                  st.markDirty();
              }

              private static void changeSanity(int d) {
                  for (UUID id : new ArrayList<>(sanity.keySet())) {
                      int v = sanity.get(id) + d;
                      sanity.put(id, Math.max(0, Math.min(100, v)));
                  }
              }

              private static void tickSanity(ServerWorld mall, List<ServerPlayerEntity> ps) {
                  boolean dark = has(AType.LIGHTS);
                  if (anomalies.isEmpty() && now % 100 == 0) changeSanity(1);
                  if (dark && now % 100 == 0) changeSanity(-2);
                  for (ServerPlayerEntity p : ps) {
                      int sn = sanity.getOrDefault(p.getUuid(), 100);
                      if (sn < 60 && RNG.nextInt(12) == 0) {
                          Fx.sound(mall, p.getX(), p.getY(), p.getZ(), SoundEvents.AMBIENT_CAVE, 0.8f, 0.8f + RNG.nextFloat() * 0.4f);
                      }
                      if (sn < 40 && RNG.nextInt(25) == 0) {
                          p.addStatusEffect(new StatusEffectInstance(StatusEffects.DARKNESS, 60, 0, false, false, false));
                      }
                      if (sn < 25 && RNG.nextInt(30) == 0) {
                          p.addStatusEffect(new StatusEffectInstance(StatusEffects.NAUSEA, 100, 0, false, false, false));
                      }
                      p.getHungerManager().setFoodLevel(20);
                  }
              }

              /** Галлюцинации при низком рассудке: монстр на пару секунд в зале. */
              private static void tickGhosts(ServerWorld mall, List<ServerPlayerEntity> ps) {
                  Iterator<Ghost> it = ghosts.iterator();
                  while (it.hasNext()) {
                      Ghost g = it.next();
                      if (g.e.isRemoved()) {
                          it.remove();
                          continue;
                      }
                      if (!g.seen) {
                          for (ServerPlayerEntity p : ps) {
                              if (looking(p, g.e)) {
                                  g.seen = true;
                                  changeSanity(-2);
                                  Fx.sound(mall, p.getX(), p.getY(), p.getZ(), SoundEvents.ENTITY_ENDERMAN_STARE, 0.8f, 0.6f);
                                  break;
                              }
                          }
                      }
                      if (now >= g.until) {
                          g.e.discard();
                          it.remove();
                      }
                  }
                  if (ps.isEmpty() || ghosts.size() >= 2) return;
                  int low = 100;
                  for (int v : sanity.values()) low = Math.min(low, v);
                  if (low < 50 && RNG.nextInt(8) == 0) {
                      ServerPlayerEntity p = ps.get(RNG.nextInt(ps.size()));
                      Ghost g = new Ghost();
                      g.e = spawnNpc(mall, GHOST_SKINS[RNG.nextInt(GHOST_SKINS.length)], pickWatchSpot(p), 0f);
                      g.until = now + 50;
                      ghosts.add(g);
                  }
              }

              /** Мерцание света и случайные звуки. */
              private static void tickAtmosphere(ServerWorld mall, List<ServerPlayerEntity> ps) {
                  if (!flicker.isEmpty()) {
                      Iterator<Map.Entry<BlockPos, Integer>> it = flicker.entrySet().iterator();
                      while (it.hasNext()) {
                          Map.Entry<BlockPos, Integer> en = it.next();
                          if (now >= en.getValue()) {
                              if (!has(AType.LIGHTS)) mall.setBlockState(en.getKey(), MallBlocks.LAMP_ON.getDefaultState(), 2);
                              it.remove();
                          }
                      }
                  }
                  if (ps.isEmpty()) return;
                  if (now >= nextFlicker) {
                      nextFlicker = now + 120 + RNG.nextInt(200);
                      if (!has(AType.LIGHTS)) {
                          ServerPlayerEntity p = ps.get(RNG.nextInt(ps.size()));
                          int ceilY = new int[]{MallBuilder.CB, MallBuilder.CG, MallBuilder.CF}[MallBuilder.floorOf(p.getY())];
                          int n = 0;
                          List<BlockPos> near = new ArrayList<>();
                          for (BlockPos b : MallBuilder.LIGHTS) {
                              if (b.getY() == ceilY && Math.abs(b.getX() - p.getX()) < 26 && Math.abs(b.getZ() - p.getZ()) < 26) near.add(b);
                          }
                          Collections.shuffle(near, RNG);
                          for (BlockPos b : near) {
                              if (n++ >= 4) break;
                              mall.setBlockState(b, MallBlocks.LAMP_OFF.getDefaultState(), 2);
                              flicker.put(b, now + 3 + RNG.nextInt(8));
                          }
                      }
                  }
                  if (now >= nextAmbient) {
                      nextAmbient = now + 300 + RNG.nextInt(500);
                      Object[] sounds = {SoundEvents.AMBIENT_CAVE, SoundEvents.ENTITY_ZOMBIE_VILLAGER_AMBIENT,
                              SoundEvents.BLOCK_CHEST_CLOSE, SoundEvents.BLOCK_IRON_TRAPDOOR_CLOSE,
                              SoundEvents.ENTITY_ENDERMAN_AMBIENT, SoundEvents.BLOCK_WOODEN_DOOR_CLOSE};
                      ServerPlayerEntity p = ps.get(RNG.nextInt(ps.size()));
                      Fx.sound(mall, p.getX() + RNG.nextInt(16) - 8, p.getY(), p.getZ() + RNG.nextInt(16) - 8,
                              sounds[RNG.nextInt(sounds.length)], 0.9f, 0.5f + RNG.nextFloat() * 0.5f);
                  }
              }

              // ================= покупатели =================

              private static Vec3d door() {
                  return RNG.nextBoolean() ? MallBuilder.DOOR_A : MallBuilder.DOOR_B;
              }

              private static Vec3d slot(int i) {
                  return new Vec3d(39.5, 64, 19.5 + Math.min(i, 5));
              }

              private static MallNpcEntity spawnNpc(ServerWorld mall, int variant, Vec3d at, float yaw) {
                  MallNpcEntity e = new MallNpcEntity(MallEntities.typeFor(variant), mall);
                  e.managed = true;
                  e.setVariant(variant);
                  e.refreshPositionAndAngles(at.x, at.y, at.z, yaw, 0f);
                  mall.spawnEntity(e);
                  return e;
              }

              private static void spawnCustomer(ServerWorld mall) {
                  Customer c = new Customer();
                  c.e = spawnNpc(mall, RNG.nextInt(8), door(), 90f);
                  c.state = ENTER;
                  c.speed = 0.85 + RNG.nextDouble() * 0.35;
                  c.browse = 35 + RNG.nextInt(80);
                  c.maxPatience = 700 + RNG.nextInt(600);
                  c.want = 1 + (RNG.nextInt(3) == 0 ? 1 + RNG.nextInt(2) : 0);
                  customers.add(c);
              }

              private static Customer customerOf(Entity e) {
                  for (Customer c : customers) if (c.e == e) return c;
                  return null;
              }

              private static int pickShelf() {
                  List<Integer> ok = new ArrayList<>();
                  for (int i = 0; i < stock.length; i++) if (stock[i] > 0) ok.add(i);
                  if (ok.isEmpty()) return -1;
                  return ok.get(RNG.nextInt(ok.size()));
              }

              private static void angryLeave(Customer c) {
                  queue.remove(c);
                  c.state = LEAVE;
                  c.t = 0;
                  satisfaction = Math.max(0, satisfaction - 8);
                  angry++;
                  broadcast(Text.literal("Покупатель ушёл недовольным.").formatted(Formatting.RED), true);
              }

              private static void panicLeave(Customer c) {
                  queue.remove(c);
                  c.state = LEAVE;
                  c.t = 0;
                  c.speed = 1.6;
              }

              private static void tickCustomers(ServerWorld mall) {
                  for (Customer c : new ArrayList<>(customers)) {
                      if (c.e.isRemoved()) {
                          queue.remove(c);
                          customers.remove(c);
                          continue;
                      }
                      c.t++;
                      switch (c.state) {
                          case ENTER -> {
                              c.shelf = pickShelf();
                              if (c.shelf < 0) {
                                  angryLeave(c);
                              } else {
                                  c.state = SHOP;
                                  c.t = 0;
                              }
                          }
                          case SHOP -> {
                              Vec3d a = MallBuilder.SHELVES.get(c.shelf).approach();
                              if (c.t % 15 == 1) c.e.getNavigation().startMovingTo(a.x, a.y, a.z, c.speed);
                              if (c.e.squaredDistanceTo(a.x, a.y, a.z) < 2.5) {
                                  c.state = BROWSE;
                                  c.t = 0;
                              } else if (c.t > 700) {
                                  angryLeave(c);
                              }
                          }
                          case BROWSE -> {
                              MallBuilder.Shelf sh = MallBuilder.SHELVES.get(c.shelf);
                              c.e.getLookControl().lookAt(sh.x1() + (sh.x2() - sh.x1() + 1) / 2.0, 65, sh.z() + 0.5);
                              if (c.t >= c.browse) {
                                  if (stock[c.shelf] > 0) {
                                      stock[c.shelf]--;
                                      MallBuilder.refreshShelf(mall, c.shelf, stock[c.shelf]);
                                      c.got++;
                                  }
                                  if (c.got >= c.want) {
                                      c.state = QUEUE;
                                      c.t = 0;
                                      queue.add(c);
                                  } else {
                                      c.shelf = pickShelf();
                                      if (c.shelf < 0) {
                                          if (c.got > 0) {
                                              c.state = QUEUE;
                                              c.t = 0;
                                              queue.add(c);
                                          } else {
                                              angryLeave(c);
                                          }
                                      } else {
                                          c.state = SHOP;
                                          c.t = 0;
                                      }
                                  }
                              }
                          }
                          case QUEUE -> {
                              int idx = queue.indexOf(c);
                              if (idx < 0) {
                                  c.state = LEAVE;
                                  c.t = 0;
                                  break;
                              }
                              Vec3d q = slot(idx);
                              if (c.t % 10 == 1 && c.e.squaredDistanceTo(q.x, q.y, q.z) > 0.6) {
                                  c.e.getNavigation().startMovingTo(q.x, q.y, q.z, c.speed);
                              }
                              if (idx == 0 && c.e.squaredDistanceTo(q.x, q.y, q.z) < 2.0) {
                                  c.e.getLookControl().lookAt(39.5, 65.5, 18.5);
                              } else if (c.e.squaredDistanceTo(q.x, q.y, q.z) < 1.5 && RNG.nextInt(90) == 0 && !server.getPlayerManager().getPlayerList().isEmpty()) {
                                  ServerPlayerEntity pl = nearest(players().isEmpty() ? server.getPlayerManager().getPlayerList() : players(), c.e);
                                  c.e.getLookControl().lookAt(pl);
                              }
                              if (!c.impostor) {
                                  c.patience++;
                                  if (c.patience > c.maxPatience) angryLeave(c);
                              }
                          }
                          case LEAVE -> {
                              Vec3d d = MallBuilder.DOOR_A;
                              if (c.t % 15 == 1) c.e.getNavigation().startMovingTo(d.x, d.y, d.z, Math.max(1.0, c.speed));
                              if (c.e.squaredDistanceTo(d.x, d.y, d.z) < 12 || c.t > 900) c.e.discard();
                          }
                          default -> {
                          }
                      }
                  }
              }

              // ================= взаимодействие игрока =================

              public static void useBlock(ServerPlayerEntity p, ServerWorld w, BlockPos pos) {
                  if (pos.equals(MallBuilder.REGISTER)) {
                      serve(p, w);
                      return;
                  }
                  if (pos.equals(MallBuilder.PHONE)) {
                      phone(p, w);
                      return;
                  }
                  for (BlockPos b : MallBuilder.BREAKER) {
                      if (pos.equals(b)) {
                          breaker(p, w);
                          return;
                      }
                  }
                  for (int i = 0; i < MallBuilder.SHELVES.size(); i++) {
                      if (MallBuilder.SHELVES.get(i).contains(pos)) {
                          shelfUse(p, w, i);
                          return;
                      }
                  }
                  if (parcels.contains(pos)) {
                      w.setBlockState(pos, AIR, 3);
                      parcels.remove(pos);
                      p.getInventory().offerOrDrop(new ItemStack(MallItems.GOODS_BOX, 3));
                      Fx.sound(w, pos.getX() + 0.5, pos.getY(), pos.getZ() + 0.5, SoundEvents.ENTITY_ITEM_PICKUP, 1f, 1f);
                      p.sendMessage(Text.literal("Вы забрали посылку: +3 коробки товара.").formatted(Formatting.GREEN), true);
                      return;
                  }
                  Anomaly cursed = anomalyAt(AType.PARCEL, pos);
                  if (cursed != null) {
                      p.sendMessage(Text.literal("Вы открыли красную посылку... зря.").formatted(Formatting.DARK_RED), false);
                      resolve(cursed, false, w);
                  }
              }

              public static void attackBlock(ServerPlayerEntity p, ServerWorld w, BlockPos pos) {
                  if (!active) return;
                  Anomaly cursed = anomalyAt(AType.PARCEL, pos);
                  if (cursed != null) {
                      resolve(cursed, true, w);
                      return;
                  }
                  if (w.getBlockState(pos).isOf(MallBlocks.LITTER)) {
                      w.setBlockState(pos, AIR, 3);
                      litter.remove(pos);
                      reward(4);
                      p.sendMessage(Text.literal("Мусор убран. +$4").formatted(Formatting.GREEN), true);
                  }
              }

              public static void hitNpc(ServerPlayerEntity p, MallNpcEntity npc) {
                  if (!active) return;
                  ServerWorld w = p.getServerWorld();
                  Customer c = customerOf(npc);
                  Anomaly a = anomalyOfEnt(npc);
                  if (a != null) {
                      switch (a.type) {
                          case FACELESS, MIMIC -> resolve(a, true, w);
                          case CRAWLER, CHASER -> {
                              if (now < a.hitCool) return;
                              a.hitCool = now + 8;
                              a.hp--;
                              Fx.sound(w, npc.getX(), npc.getY(), npc.getZ(), SoundEvents.ENTITY_PLAYER_ATTACK_STRONG, 1f, 0.7f);
                              w.spawnParticles(ParticleTypes.CRIT, npc.getX(), npc.getY() + 1, npc.getZ(), 8, 0.3, 0.4, 0.3, 0.2);
                              if (a.hp <= 0) {
                                  resolve(a, true, w);
                              } else {
                                  p.sendMessage(Text.literal("Удар! Ещё " + a.hp + ".").formatted(Formatting.YELLOW), true);
                              }
                          }
                          case WATCHER -> p.sendMessage(Text.literal("Оно не реагирует на удары. Смотри на него.").formatted(Formatting.GRAY), true);
                          case HANGED -> p.sendMessage(Text.literal("Не трогай его. Отвернись.").formatted(Formatting.GRAY), true);
                          default -> {
                          }
                      }
                      return;
                  }
                  if (c != null) {
                      satisfaction = Math.max(0, satisfaction - 5);
                      p.sendMessage(Text.literal("Не бейте покупателей!").formatted(Formatting.RED), true);
                  }
              }

              private static void serve(ServerPlayerEntity p, ServerWorld w) {
                  if (!active) {
                      p.sendMessage(Text.literal("Касса не работает: смена не идёт.").formatted(Formatting.GRAY), true);
                      return;
                  }
                  Customer c = queue.isEmpty() ? null : queue.get(0);
                  Vec3d s0 = slot(0);
                  if (c == null || c.state != QUEUE || c.e.squaredDistanceTo(s0.x, s0.y, s0.z) > 6.0) {
                      p.sendMessage(Text.literal("У кассы никого нет.").formatted(Formatting.GRAY), true);
                      return;
                  }
                  if (c.impostor) {
                      Anomaly a = anomalyOfEnt(c.e);
                      p.sendMessage(Text.literal("Вы обслужили то, что не должно ничего покупать...").formatted(Formatting.DARK_RED), false);
                      if (a != null) {
                          resolve(a, false, w);
                      } else {
                          queue.remove(c);
                          c.e.discard();
                          changeSanity(-20);
                          addDebt(40);
                      }
                      return;
                  }
                  int pay = c.got * (8 + RNG.nextInt(7)) + (c.patience < 300 ? 5 : 0);
                  if (pay <= 0) pay = 6;
                  reward(pay);
                  served++;
                  satisfaction = Math.min(100, satisfaction + 3);
                  queue.remove(c);
                  c.state = LEAVE;
                  c.t = 0;
                  MallState st = MallState.get(server);
                  p.sendMessage(Text.literal("+$" + pay + "   Долг: $" + st.debt).formatted(Formatting.GREEN), true);
                  Fx.sound(w, c.e.getX(), c.e.getY(), c.e.getZ(), SoundEvents.ENTITY_EXPERIENCE_ORB_PICKUP, 1f, 1.2f);
                  w.spawnParticles(ParticleTypes.HAPPY_VILLAGER, c.e.getX(), c.e.getY() + 1.5, c.e.getZ(), 5, 0.3, 0.3, 0.3, 0.02);
              }

              private static void shelfUse(ServerPlayerEntity p, ServerWorld w, int i) {
                  ItemStack held = p.getMainHandStack();
                  if (held.isOf(MallItems.GOODS_BOX)) {
                      if (stock[i] >= 4) {
                          p.sendMessage(Text.literal("Полка уже полная.").formatted(Formatting.GRAY), true);
                      } else {
                          held.decrement(1);
                          stock[i] = 4;
                          MallBuilder.refreshShelf(w, i, 4);
                          Fx.sound(w, p.getX(), p.getY(), p.getZ(), SoundEvents.ENTITY_ITEM_PICKUP, 1f, 0.8f);
                          p.sendMessage(Text.literal("Полка пополнена (4/4).").formatted(Formatting.GREEN), true);
                      }
                  } else {
                      p.sendMessage(Text.literal("Полка: " + stock[i] + "/4. Нужна коробка товара (их привозят в подвал).")
                              .formatted(Formatting.GRAY), true);
                  }
              }

