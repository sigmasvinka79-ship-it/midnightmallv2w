          import net.minecraft.util.shape.VoxelShapes;

          /** Автогенерируется gen.py. Все блоки неразрушаемы, текстуры рисуются процедурно. */
          public final class MallBlocks {
              private MallBlocks() {}

              static final VoxelShape SHAPE_FULL = VoxelShapes.fullCube();
              static final VoxelShape SHAPE_COUNTER = VoxelShapes.cuboid(0.0, 0.0, 0.0, 1.0, 1.5, 1.0);
