              static final VoxelShape SHAPE_PHONE = VoxelShapes.cuboid(0.25, 0.0, 0.3, 0.75, 0.35, 0.7);
              static final VoxelShape SHAPE_MANN = VoxelShapes.cuboid(0.1, 0.0, 0.3, 0.9, 1.0, 0.7);

              private static AbstractBlock.Settings base() {
                  return AbstractBlock.Settings.create().strength(-1.0f, 3600000.0f).sounds(BlockSoundGroup.STONE);
              }

              private static Block reg(String id, Block block) {
                  Registry.register(Registries.BLOCK, MidnightMall.id(id), block);
                  Registry.register(Registries.ITEM, MidnightMall.id(id), new BlockItem(block, new Item.Settings()));
                  return block;
              }

          ''' + '\n'.join(lines) + '''

